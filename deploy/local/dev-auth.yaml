# RFC-007：只随本机安装脚本应用的开发角色登录器。生产清单不引用它。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewstation-dev-auth
  namespace: crewstation-system
  labels: { app.kubernetes.io/name: crewstation-dev-auth, app.kubernetes.io/part-of: crewstation, app.kubernetes.io/managed-by: crewstation-local }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: crewstation-dev-auth }
  template:
    metadata:
      labels: { app.kubernetes.io/name: crewstation-dev-auth, app.kubernetes.io/part-of: crewstation, app.kubernetes.io/managed-by: crewstation-local }
    spec:
      containers:
        - name: dev-auth
          image: cs-control-plane:dev
          imagePullPolicy: IfNotPresent
          args: ["tools/dev-auth/main.ts"]
          ports: [{ name: http, containerPort: 7460 }]
          envFrom:
            - secretRef: { name: crewstation-dev-auth }
          env:
            - { name: CS_DEV_AUTH_PORT, value: "7460" }
            - { name: CS_DEV_AUTH_PUBLIC_ORIGIN, value: "http://dev-auth.cs.localhost" }
            - { name: CS_DEV_AUTH_INTERNAL_ORIGIN, value: "http://crewstation-dev-auth.crewstation-system.svc.cluster.local:7460" }
            - { name: CS_CONSOLE_ORIGIN, value: "http://console.cs.localhost" }
            - { name: CS_PLATFORM_ORIGIN, value: "http://traefik.crewstation-system.svc.cluster.local" }
            - { name: CS_PLATFORM_HOST, value: "console.cs.localhost" }
          readinessProbe: { httpGet: { path: /readyz, port: 7460 }, periodSeconds: 2, failureThreshold: 90 }
          livenessProbe: { httpGet: { path: /healthz, port: 7460 }, periodSeconds: 15, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: "250m", memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: crewstation-dev-auth
  namespace: crewstation-system
spec:
  # readiness 代表真实 OIDC 播种完成；播种期间 cs-auth 已需要回调这里取 discovery／token，
  # 因而 Service 必须先把尚未 Ready 的唯一 Pod 发布出来，避免 readiness 自锁。
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: crewstation-dev-auth }
  ports: [{ name: http, port: 7460, targetPort: 7460 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crewstation-dev-auth
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`dev-auth.cs.localhost`)
      kind: Rule
      priority: 100
      middlewares: [{ name: drop-identity-headers }]
      services: [{ name: crewstation-dev-auth, port: 7460 }]
