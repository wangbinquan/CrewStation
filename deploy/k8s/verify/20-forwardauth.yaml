# Verification D: Traefik ForwardAuth smoke test with two stand-in auth services.
#   auth-ok    traefik/whoami (verbose)   answers 200 to everything  -> request passes to whoami
#   auth-deny  hashicorp/http-echo        answers 401 "denied"       -> request is blocked with 401
# Hosts: protected-ok.cs.localhost and protected-deny.cs.localhost.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-ok
  namespace: crewstation-verify
  labels:
    app: auth-ok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-ok
  template:
    metadata:
      labels:
        app: auth-ok
    spec:
      containers:
        - name: whoami
          image: docker.io/traefik/whoami:v1.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --port=80
            - --verbose
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: auth-ok
  namespace: crewstation-verify
spec:
  selector:
    app: auth-ok
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deny
  namespace: crewstation-verify
  labels:
    app: auth-deny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-deny
  template:
    metadata:
      labels:
        app: auth-deny
    spec:
      containers:
        - name: http-echo
          image: docker.io/hashicorp/http-echo:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:5678
            - -status-code=401
            - -text=denied by auth-deny stand-in
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: auth-deny
  namespace: crewstation-verify
spec:
  selector:
    app: auth-deny
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-ok
  namespace: crewstation-verify
spec:
  forwardAuth:
    address: http://auth-ok.crewstation-verify.svc.cluster.local/verify-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-deny
  namespace: crewstation-verify
spec:
  forwardAuth:
    address: http://auth-deny.crewstation-verify.svc.cluster.local/verify-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: protected
  namespace: crewstation-verify
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`protected-ok.cs.localhost`)
      kind: Rule
      middlewares:
        - name: forwardauth-ok
      services:
        - name: whoami
          port: 80
    - match: Host(`protected-deny.cs.localhost`)
      kind: Rule
      middlewares:
        - name: forwardauth-deny
      services:
        - name: whoami
          port: 80
