apiVersion: v1
kind: ServiceAccount
metadata:
  name: crewstation-control
  namespace: crewstation-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crewstation-control
rules:
  # 归档命名空间清理前列全所有 namespaced kinds（含 CRD）；任何读失败都阻断删除。
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [list]
  # nodes/proxy is not path-scoped by Kubernetes RBAC. The client only calls stats/summary and metrics/cadvisor.
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims, secrets, configmaps, serviceaccounts, resourcequotas, events]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [replicationcontrollers]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [apps]
    resources: [statefulsets, daemonsets]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [crd.projectcalico.org]
    resources: [globalnetworkpolicies]
    resourceNames: [crewstation-image-build-registry]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crewstation-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crewstation-control
subjects:
  - kind: ServiceAccount
    name: crewstation-control
    namespace: crewstation-system
