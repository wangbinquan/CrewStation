apiVersion: v1
kind: ServiceAccount
metadata:
  name: crewstation-control
  namespace: crewstation-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crewstation-control
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims, secrets, configmaps, serviceaccounts, resourcequotas, events]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, delete, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crewstation-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crewstation-control
subjects:
  - kind: ServiceAccount
    name: crewstation-control
    namespace: crewstation-system
