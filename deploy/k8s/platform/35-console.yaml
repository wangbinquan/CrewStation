apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: crewstation-system
  labels: { app.kubernetes.io/name: console, app.kubernetes.io/part-of: crewstation }
spec:
  replicas: 1
  # 本机节点 CPU 预约常年接近满额，滚动更新时新 Pod 排不进去；工作台是静态资源服务，先停旧再起新即可。
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: console, app.kubernetes.io/part-of: crewstation }
    spec:
      containers:
        - name: console
          image: cs-console:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8090 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: crewstation-system
spec:
  selector: { app.kubernetes.io/name: console }
  ports: [{ name: http, port: 8090, targetPort: 8090 }]
