# 网关中间件与平台自身的路由。业务服务的路由由 gateway 模块按服务生成，不在这里。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-user
  namespace: crewstation-system
spec:
  forwardAuth:
    address: http://cs-auth.crewstation-system.svc.cluster.local:8081/forward-auth/user
    trustForwardHeader: false
    # x-cs-user-attrs 是自定义身份字段的 JSON（RFC-005 §7.2）；x-cs-auth-method 是平台内部头，只在工作台目标上注入。
    authResponseHeaders: [x-cs-user-id, x-cs-user-name, x-cs-user-email, x-cs-user-attrs, x-cs-identity-token, x-cs-auth-method, x-cs-request-id, Cookie]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-service
  namespace: crewstation-system
spec:
  forwardAuth:
    address: http://cs-auth.crewstation-system.svc.cluster.local:8081/forward-auth/service
    trustForwardHeader: false
    authResponseHeaders: [x-cs-source-service, x-cs-source-slot, x-cs-source-token, x-cs-trace-id, x-cs-request-id]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: drop-identity-headers
  namespace: crewstation-system
spec:
  headers:
    customRequestHeaders:
      x-cs-user-id: ""
      x-cs-user-name: ""
      x-cs-user-email: ""
      x-cs-user-attrs: ""
      x-cs-identity-token: ""
      x-cs-auth-method: ""
      x-cs-source-service: ""
      x-cs-source-slot: ""
      x-cs-source-token: ""
---
# 平台接口限流（RFC-025 T10，设计 §7.3）：按网关注入的 x-cs-user-id 分桶，链在用户 ForwardAuth 之后。取值是内置默认；
# 装好之后由 cs-controller 的调和器按「平台设置」里的限流改写（台账里的 rate-limit-policy 记录，字段管理者 crewstation）。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-platform-api
  namespace: crewstation-system
spec:
  rateLimit:
    average: 20
    burst: 40
    period: 1s
    sourceCriterion:
      requestHeaderName: x-cs-user-id
---
# 每人同时在处理的请求数上限；推送流（资源推送、任务流）不挂它，否则长连接会占住名额。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: in-flight-platform-api
  namespace: crewstation-system
spec:
  inFlightReq:
    amount: 16
    sourceCriterion:
      requestHeaderName: x-cs-user-id
---
# 用户域：控制台主机。登录与 JWKS 不鉴权；平台 API 与工作台页面经用户 ForwardAuth。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-auth
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`console.cs.localhost`) && (PathPrefix(`/auth`) || PathPrefix(`/.well-known`))
      kind: Rule
      priority: 100
      middlewares: [{ name: drop-identity-headers }]
      services: [{ name: cs-auth, port: 8081 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-api
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`console.cs.localhost`) && PathPrefix(`/v1`)
      kind: Rule
      priority: 90
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-user }, { name: rate-limit-platform-api }, { name: in-flight-platform-api }]
      services: [{ name: cs-api, port: 8080 }]
---
# 资源推送流（SSE 长连接，RFC-025 §8）：限建连的频率，不挂并发上限。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-resource-streams
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`console.cs.localhost`) && PathRegexp(`^/v1/(projects/[^/]+|admin)/resources/stream$`)
      kind: Rule
      priority: 96
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-user }, { name: rate-limit-platform-api }]
      services: [{ name: cs-api, port: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-stream
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`console.cs.localhost`) && PathPrefix(`/v1/tasks`) && PathRegexp(`/stream$`)
      kind: Rule
      priority: 95
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-user }]
      services: [{ name: cs-session, port: 8083 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-app
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`console.cs.localhost`)
      kind: Rule
      priority: 10
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-user }]
      services: [{ name: console, port: 8090 }]
---
# 服务域：平台 API 主机。JWKS 公开；其余按源 Pod IP 识别调用方并按放行表放行。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-api-jwks
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`api.svc.cs.internal`) && PathPrefix(`/.well-known`)
      kind: Rule
      priority: 100
      services: [{ name: cs-auth, port: 8081 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-api
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`api.svc.cs.internal`)
      kind: Rule
      priority: 10
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-service }]
      services: [{ name: cs-api, port: 8080 }]
---
# 服务域：事件中心入口，EventProducer 以自身身份投递。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-events
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`events.svc.cs.internal`)
      kind: Rule
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-service }]
      services: [{ name: cs-events, port: 8084 }]
---
# 服务域：两个平台 MCP。开发容器内的 Agent 经此连接；网关按源 Pod IP 注入调用方身份，无登录跳转。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-mcp-capabilities
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`mcp-capabilities.svc.cs.internal`)
      kind: Rule
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-service }]
      services: [{ name: mcp-capabilities, port: 8085 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-mcp-operations
  namespace: crewstation-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`mcp-operations.svc.cs.internal`)
      kind: Rule
      middlewares: [{ name: drop-identity-headers }, { name: forward-auth-service }]
      services: [{ name: mcp-operations, port: 8086 }]
