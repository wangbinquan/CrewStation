apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-api
  namespace: crewstation-system
  labels: { app.kubernetes.io/name: cs-api, app.kubernetes.io/part-of: crewstation, app.kubernetes.io/managed-by: crewstation, crewstation.io/project: platform, crewstation.io/service: cs-api, crewstation.io/workload: platform }
spec:
  replicas: 1
  # 本机单节点的 CPU 请求已被占满，滚动更新的新 Pod 会一直 Pending（2026-09-16 cs-api 卡死时重启等了 6 分钟）；单副本直接重建。
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: cs-api }
  template:
    metadata:
      finalizers: [crewstation.io/object-transfer-stop]
      labels: { app.kubernetes.io/name: cs-api, app.kubernetes.io/part-of: crewstation, app.kubernetes.io/managed-by: crewstation, crewstation.io/project: platform, crewstation.io/service: cs-api, crewstation.io/workload: platform }
    spec:
      serviceAccountName: crewstation-control
      # 控制面以 bun（GID 1000）运行，让完整统计报告的 emptyDir 可写。
      securityContext: { fsGroup: 1000 }
      containers:
        - name: cs-api
          image: cs-control-plane:dev
          imagePullPolicy: IfNotPresent
          args: ["apps/cs-api/src/main.ts"]
          ports: [{ name: http, containerPort: 8080 }, { name: objects, containerPort: 8087 }]
          envFrom:
            - configMapRef: { name: crewstation-env }
            - configMapRef: { name: crewstation-metrics-env, optional: true }
            - configMapRef: { name: crewstation-objects-env, optional: true }
            - secretRef: { name: crewstation-metrics, optional: true }
            - secretRef: { name: crewstation-secrets }
          env:
            - { name: CS_PLATFORM_POD_UID, valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }

          volumeMounts:
            - { name: runtime-report-spool, mountPath: /var/lib/crewstation/observability }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 15, initialDelaySeconds: 10, timeoutSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
      volumes:
        - { name: runtime-report-spool, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: cs-api
  namespace: crewstation-system
spec:
  selector: { app.kubernetes.io/name: cs-api }
  ports: [{ name: http, port: 8080, targetPort: 8080 }, { name: objects, port: 8087, targetPort: 8087 }]
