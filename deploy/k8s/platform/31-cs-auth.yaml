apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-auth
  namespace: crewstation-system
  labels: { app.kubernetes.io/name: cs-auth, app.kubernetes.io/part-of: crewstation, app.kubernetes.io/managed-by: crewstation, crewstation.io/project: platform, crewstation.io/service: cs-auth, crewstation.io/workload: platform }
spec:
  replicas: 1
  # 本机单节点的 CPU 请求已被占满，滚动更新的新 Pod 会一直 Pending（2026-09-16 cs-api 卡死时重启等了 6 分钟）；单副本直接重建。
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: cs-auth }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cs-auth, app.kubernetes.io/part-of: crewstation, app.kubernetes.io/managed-by: crewstation, crewstation.io/project: platform, crewstation.io/service: cs-auth, crewstation.io/workload: platform }
    spec:
      serviceAccountName: crewstation-control
      containers:
        - name: cs-auth
          image: cs-control-plane:dev
          imagePullPolicy: IfNotPresent
          args: ["apps/cs-auth/src/main.ts"]
          ports: [{ name: http, containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: crewstation-env }
            - secretRef: { name: crewstation-secrets }
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }

          readinessProbe: { httpGet: { path: /healthz, port: 8081 }, periodSeconds: 5, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8081 }, periodSeconds: 15, initialDelaySeconds: 10, timeoutSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: cs-auth
  namespace: crewstation-system
spec:
  selector: { app.kubernetes.io/name: cs-auth }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]
