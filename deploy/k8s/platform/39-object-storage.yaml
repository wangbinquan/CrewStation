# RFC-035 local installation only. RF1 is dev-only; these system volumes outlive business tasks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crewstation-objects-env
  namespace: crewstation-system
data:
  CS_OBJECT_STORAGE_MODE: local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: crewstation-system
data:
  garage.toml: |
    metadata_dir = "/storage/meta"
    data_dir = "/storage/data"
    db_engine = "sqlite"
    replication_factor = 1
    consistency_mode = "consistent"
    metadata_fsync = true
    data_fsync = true
    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "127.0.0.1:3901"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"
    [admin]
    api_bind_addr = "0.0.0.0:3903"
    metrics_require_token = true
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: crewstation-system
  labels: { app.kubernetes.io/name: garage, app.kubernetes.io/part-of: crewstation }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: garage }
  ports: [{ name: s3, port: 3900 }, { name: admin, port: 3903 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: crewstation-system
  labels: { app.kubernetes.io/name: garage, app.kubernetes.io/part-of: crewstation }
spec:
  serviceName: garage
  replicas: 1
  persistentVolumeClaimRetentionPolicy: { whenDeleted: Retain, whenScaled: Retain }
  selector:
    matchLabels: { app.kubernetes.io/name: garage }
  template:
    metadata:
      labels: { app.kubernetes.io/name: garage, app.kubernetes.io/part-of: crewstation }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true }
      terminationGracePeriodSeconds: 90
      containers:
        - name: garage
          # v2.4.1 index; ARM64 child sha256:2749e371... and AMD64 child sha256:0d7c74fc... are recorded in RFC035.
          image: dxflrs/garage@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          command: [/garage]
          args: [server, --single-node, --default-bucket]
          envFrom: [{ secretRef: { name: garage-credentials } }]
          ports: [{ name: s3, containerPort: 3900 }, { name: admin, containerPort: 3903 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 25m, memory: 128Mi }, limits: { cpu: "2", memory: 1Gi } }
          startupProbe: { httpGet: { path: /health, port: 3903 }, periodSeconds: 5, failureThreshold: 60, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /health, port: 3903 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { tcpSocket: { port: 3903 }, periodSeconds: 15, failureThreshold: 4, timeoutSeconds: 3 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: metadata, mountPath: /storage/meta }
            - { name: data, mountPath: /storage/data }
      volumes:
        - name: config
          configMap: { name: garage-config }
  volumeClaimTemplates:
    - metadata:
        name: metadata
        labels: { app.kubernetes.io/name: garage, app.kubernetes.io/part-of: crewstation, crewstation.io/storage-lifecycle: system }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
    - metadata:
        name: data
        labels: { app.kubernetes.io/name: garage, app.kubernetes.io/part-of: crewstation, crewstation.io/storage-lifecycle: system }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 100Gi } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage
  namespace: crewstation-system
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: garage } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: cs-api } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: cs-controller } }
      ports: [{ protocol: TCP, port: 3900 }, { protocol: TCP, port: 3903 }]
  egress: []
