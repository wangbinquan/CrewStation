# 用例执行体系的说明见 docs/engineering/testing.md §8。每一层用例一个作业，GitHub 上一眼看得见哪一层红了：
#   static  —— 结构规则、lint、两次类型检查（本机 `bun run check` 的前半段，同一条 check:static）
#   unit    —— 方法级 UT：就近放在源码旁、不依赖任何环境的用例；不起任何服务，一条跳过都不允许
#   module  —— 模块级 UT：各单元 tests/ 下的用例，真实 PostgreSQL，数据库被点名要求
#   console —— 工作台渲染与模型用例，再加工作台构建
#   gate    —— 合并三层的报告：每个用例文件都必须在某一层真的跑过；新增代码防护；任何一层红它就红
#   e2e     —— 实机验收：真装一套平台，用无头浏览器从网关打进去
# 分层由 tools/testguard/testTiers.ts 一处决定，四层合起来就是本机 `bun test` 跑的全部文件。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 主干开发下每个推送的 SHA 都要各自跑完（开发规则 §3「按自己的 sha 查 CI」），所以 push 不互相取消；
# 只有同一个 PR 的旧运行会被新提交取消。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # 新增代码防护的对比基线：PR 取目标分支，push 取这次推送之前的提交；手动触发时为空，退回到上一个提交。
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  static:
    name: static（结构规则 · lint · 类型）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: bun run check:static

  unit:
    name: unit（方法级 UT）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          standalone: 'true'
      # 这一层不起任何服务：用例一旦依赖环境就会在这里跳过，而跳过在这一层是失败。
      - run: bun run test:unit --cover
      - name: upload tier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-unit
          path: coverage/unit/
          if-no-files-found: warn
          retention-days: 14

  module:
    name: module（模块级 UT）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: crewstation
          POSTGRES_PASSWORD: crewstation-dev
          POSTGRES_DB: crewstation
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U crewstation" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CS_TEST_DATABASE_URL: postgres://crewstation:crewstation-dev@127.0.0.1:55432/crewstation
      # 数据库是这个作业自己起的：连不上是故障。不点名的话，依赖它的六十来组用例会整层跳过、作业照绿。
      CS_TEST_REQUIRE: database
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: bun run test:module --cover
      - name: upload tier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-module
          path: coverage/module/
          if-no-files-found: warn
          retention-days: 14

  console:
    name: console（工作台）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: bun run test:console --cover
      - run: cd apps/console && bun run build
      - name: upload tier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-console
          path: coverage/console/
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: gate（汇总 · 新增代码防护）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [static, unit, module, console]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          # 新增代码防护要对本次推送的 before..after 做 diff，浅克隆里没有 before。
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@v4
        with: { name: tier-unit, path: coverage/unit }
      - uses: actions/download-artifact@v4
        if: always()
        with: { name: tier-module, path: coverage/module }
      - uses: actions/download-artifact@v4
        if: always()
        with: { name: tier-console, path: coverage/console }
      # 合并三层：按层汇总、逐条列出的跳过、覆盖率、删除的用例；并审计每个用例文件都在某一层真的跑过。
      - name: test report and tier audit
        if: always()
        run: bun run test:report --tiers unit,module,console --title "unit + module + console" --base "$BASE_SHA"
      # 只看本次推送改动的行：改到的生产文件必须有用例加载它，改动的可执行行被执行到的比例不低于下限。
      - name: new-code protection
        if: always()
        run: bun run test:patch --tiers unit,module,console --base "$BASE_SHA"
      - name: every tier must be green
        if: always()
        run: |
          echo "static=${{ needs.static.result }} unit=${{ needs.unit.result }} module=${{ needs.module.result }} console=${{ needs.console.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.module.result }}" = success ] && [ "${{ needs.console.result }}" = success ]

  # 前台实机验收：在 CI 里真装一套平台，再用无头浏览器打它。
  # 这一层只在这个作业里跑（别的作业没有集群也没有浏览器），能力回归只能靠它兜住。
  e2e:
    name: e2e（实机端到端）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # tests/e2e 里有一组用例要真实数据库加进程内服务（apiInvocation）；这一层只在这个作业里跑，所以数据库也在这里起。
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: crewstation
          POSTGRES_PASSWORD: crewstation-dev
          POSTGRES_DB: crewstation
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U crewstation" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CS_TEST_DATABASE_URL: postgres://crewstation:crewstation-dev@127.0.0.1:55432/crewstation
      CREWSTATION_KUBE_CONTEXT: kind-crewstation
      CREWSTATION_NODE_CONTAINER: crewstation-control-plane
      # 必须落在 80：登录跳转地址由平台配置的用户域生成，不带端口。放在高位端口时浏览器会被
      # 302 到 http://console.cs.localhost/auth/login，撞上没人监听的 80，页内请求随即 Failed to fetch。
      CS_CONSOLE_URL: http://console.cs.localhost
      CS_E2E_CONSOLE: http://console.cs.localhost
      # 前台验收不起开发会话，跳过要联网装两个 Agent CLI 的任务容器镜像。
      CS_SKIP_TASK_RUNTIME: '1'
      # CI 明确使用无人值守建号；普通安装保持待初始化，由用户在浏览器创建管理员。
      CS_BOOTSTRAP_ADMIN: '1'
      # RFC-007 的固定角色入口是本机人工验收工具；产品 E2E 保持独立的身份夹具。
      CS_SKIP_DEV_AUTH: '1'
      # 网关、浏览器与管理员都是这个作业自己装的：探测不到或登录不上是故障。
      # 不点名的话整套用例会 skipIf 跳过、作业照绿，实机验收等于被悄悄关掉。
      CS_TEST_REQUIRE: e2e,database
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: crewstation
          config: .github/kind-cluster.yaml

      - name: resolve the console host to loopback
        run: echo '127.0.0.1 console.cs.localhost' | sudo tee -a /etc/hosts

      - name: bootstrap infrastructure
        run: deploy/local/bootstrap.sh --skip-verify

      # kind 把宿主机 80 接到节点 30080，这里把 Traefik 的 web NodePort 钉在 30080 上对齐。
      # 合并补丁对列表是整体替换，所以两个端口都要写全。
      - name: expose the gateway on port 80
        run: |
          kubectl -n crewstation-system patch svc traefik -p '{"spec":{"ports":[
            {"name":"web","port":80,"targetPort":"web","nodePort":30080},
            {"name":"websecure","port":443,"targetPort":"websecure"}]}}'
          for _ in $(seq 1 60); do
            curl -sS -o /dev/null --max-time 2 "$CS_CONSOLE_URL/" && exit 0
            sleep 1
          done
          echo '网关在 60s 内没有从 80 端口应答' >&2
          kubectl -n crewstation-system get svc traefik -o wide >&2; exit 1

      - name: install platform
        run: deploy/local/install-platform.sh

      - name: start the debug browser
        run: |
          google-chrome --headless=new --remote-debugging-port=9333 \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --user-data-dir=/tmp/cs-e2e-chrome about:blank >/tmp/chrome.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sSf --max-time 2 http://127.0.0.1:9333/json/version >/dev/null && exit 0
            sleep 1
          done
          echo '调试浏览器没起来' >&2; cat /tmp/chrome.log >&2; exit 1

      - name: front-end acceptance against the deployed platform
        run: bun run test:e2e --cover

      - name: test report
        if: always()
        run: bun run test:report --tiers e2e --title e2e --skip-coverage
      - name: upload tier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-e2e
          path: coverage/e2e/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: diagnostics
        if: failure()
        run: |
          kubectl -n crewstation-system get pods -o wide || true
          kubectl -n crewstation-system get svc,ingressroute || true
          for d in cs-api cs-auth console traefik; do
            echo "=== $d ==="
            kubectl -n crewstation-system logs "deploy/$d" --tail=60 || true
          done
          curl -sS -o /dev/null -w 'console %{http_code}\n' "$CS_CONSOLE_URL/" || true
