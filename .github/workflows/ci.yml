name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: crewstation
          POSTGRES_PASSWORD: crewstation-dev
          POSTGRES_DB: crewstation
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U crewstation" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CS_TEST_DATABASE_URL: postgres://crewstation:crewstation-dev@127.0.0.1:55432/crewstation
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # 模板与两个接入容器有意不在根 workspaces 里（生成出来的项目要能独立安装），
      # 但它们的测试会被根 `bun test` 收进来。不在这儿装依赖，CI 就会报 Cannot find package 'hono'。
      - name: install standalone packages
        run: |
          for dir in templates/minimal-sample integrations/gitlab-event-producer integrations/reference-api-proxy; do
            (cd "$dir" && bun install --frozen-lockfile)
          done
      - run: bun run check
      - run: cd apps/console && bun run build
