#crewstation-ux .cs-inline-tools{padding:8px;margin-bottom:6px;background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:4px}
#crewstation-ux .cs-inline-tools .cs-form{gap:8px}
#crewstation-ux .cs-cli-hidden{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#crewstation-ux .cs-data-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--cs-line);font-size:12px}
#crewstation-ux .cs-dev-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--cs-muted)}
#crewstation-ux .cs-dev-footer button{font-size:12px;padding:2px 0}
#crewstation-ux .cs-tab-attention{color:var(--cs-warn);background:var(--cs-warn-bg);padding:1px 4px;margin-left:5px;border-radius:3px}
#crewstation-ux .cs-tab-complete{color:var(--cs-good);background:var(--cs-good-bg);padding:1px 4px;margin-left:5px;border-radius:3px}
#crewstation-ux .cs-activity-list{padding:8px 12px;background:var(--cs-surface);border-bottom:1px solid var(--cs-line)}
#crewstation-ux .cs-activity-toast{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px;background:var(--cs-tint);font-size:12px}
#crewstation-ux .cs-cli-attention{padding:5px 8px;background:var(--cs-warn-bg);color:var(--cs-warn);font-size:12px}
#crewstation-ux .cs-cli-split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;align-items:start}
#crewstation-ux .cs-cli-split .cs-cli-grid{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:none!important;height:auto;grid-auto-rows:220px}
#crewstation-ux .cs-cli-split .cs-grip{display:none}
#crewstation-ux .cs-cli-split .cs-cli-window{grid-column:auto!important}
#crewstation-ux .cs-diff-block{background:var(--cs-bg);padding:14px;border:1px solid var(--cs-line);border-radius:5px;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
#crewstation-ux .cs-diff-add{color:var(--cs-good)}
#crewstation-ux .cs-diff-remove{color:var(--cs-danger)}
#crewstation-ux .cs-preview-standalone .cs-preview{min-height:400px}
@container(max-width:1000px){#crewstation-ux .cs-cli-split{grid-template-columns:minmax(0,1fr)}#crewstation-ux .cs-cli-grid[data-layout="columns"]{grid-template-columns:repeat(2,minmax(0,1fr))!important;height:auto;grid-auto-rows:220px}#crewstation-ux .cs-cli-grid[data-layout="columns"] .cs-grip{display:none}}

@container(max-width:560px){#crewstation-ux .cs-cli-grid,#crewstation-ux .cs-cli-grid[data-layout="columns"],#crewstation-ux .cs-cli-grid[data-layout="rows"][data-count="2"]{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:none!important;height:auto;grid-auto-rows:220px}#crewstation-ux .cs-cli-window{grid-column:auto!important}#crewstation-ux .cs-grip{display:none}#crewstation-ux .cs-cli-input input{font-size:16px}#crewstation-ux .cs-cli-tools>.cs-grow{display:none}#crewstation-ux .cs-dev-heading>.cs-grow{flex-basis:100%}#crewstation-ux[data-workspace="development"] select{font-size:16px}#crewstation-ux .cs-cli-window .cs-cli-compute{display:none}}
@media(pointer:coarse){#crewstation-ux[data-workspace="development"] button,#crewstation-ux[data-workspace="development"] select{min-height:44px}#crewstation-ux .cs-cli-input input{font-size:16px}#crewstation-ux .cs-grip-x{min-height:0!important;width:16px}#crewstation-ux .cs-grip-y{min-height:16px!important}}

s.cli=['1','2','3','4'].map((id,i)=>({id,state:'running',compute:'balanced',permission:'可改文件',draft:'',hidden:false,lines:[`Agent ${id} · 原生 CLI 示意`,`/work · main @ ${s.sourceVersion}`,['> 查看列表组件与筛选逻辑','> 查看 API 与数据契约','> 检查预览启动配置','> 检查工作树与生产版本'][i],['已读取 src/Welcome.tsx','已读取 server/routes/issues.ts','已读取 crewstation.yaml','已读取当前分支与部署记录'][i],['发现列表按创建时间排序。','返回字段：id、title、status。','开发预览使用独立开发数据库。','2 个已提交修改尚未上线。'][i],'等待下一条输入…']}));

function selectedMarketApp(){return marketCatalog.find(app=>app.id===s.marketAppId);}
function marketDetail(){const app=selectedMarketApp();if(!app||!canSeeApp(app))return heading('应用不可见','此应用未向你开放可见范围。',btn('返回能力市场','back-market'));return heading(app.name,app.desc,btn('返回能力市场','back-market'))+`<section class="cs-panel cs-pad cs-stack"><div class="cs-row"><span class="cs-app-glyph">${icon(app.glyph)}</span><div><strong>${app.name}</strong><div class="cs-small cs-muted">负责人 ${app.owner} · ${visibilityName(appPolicy(app).mode)}可见</div></div><span class="cs-grow"></span>${tag(app.version?'正式 '+(app.id==='demo'?s.current:app.version):'尚未上线',app.version?'good':'')}</div><div class="cs-row">${btn(app.version?'打开应用 ↗':'等待首次上线','open-market-app',true,!app.version)}${app.id==='demo'&&['admin','owner','developer'].includes(s.role)?'<button class="cs-button" data-view="dev">进入开发</button>':''}${app.id==='demo'&&owner()?btn('配置可见性','market-visibility'):''}</div><p class="cs-small cs-muted">应用内的业务操作由应用自身提供。</p></section>`;}
function marketApp(){const app=selectedMarketApp();if(!app||!canSeeApp(app))return marketDetail();return heading(app.name,'正式应用 · '+(app.id==='demo'?s.current:app.version),btn('返回应用详情','back-market-detail'))+`<section class="cs-panel cs-pad">${app.id==='demo'?businessPreview():`<div class="cs-row"><span class="cs-app-glyph">${icon(app.glyph)}</span><h2>${app.name}</h2></div><p>${app.desc}</p><div class="cs-callout">应用页面示意 · 正式产品在独立浏览器页签打开该应用。</div>`}</section>`;}
function visibilityView(){const d=s.visibilityDraft,mayEdit=owner(),person=demoUsers.find(u=>u.id===s.visibilityPreview),app=marketCatalog[0];return `<section class="cs-panel cs-pad cs-stack" aria-label="应用可见性设置"><div class="cs-row cs-spread"><div><h2>应用可见性</h2><p class="cs-small cs-muted">决定谁能在能力市场发现和查看“问题单助手”。</p></div>${tag(mayEdit?'应用负责人配置':'由应用负责人配置')}</div><p class="cs-small">当前：<strong>${visibilityName(s.appVisibility.mode)}可见</strong></p>${mayEdit?`<form class="cs-form" data-form="visibility" novalidate><label>谁可以看到此应用<select id="cs-visibility-mode" name="mode"><option value="members" ${d.mode==='members'?'selected':''}>项目成员</option><option value="all" ${d.mode==='all'?'selected':''}>全部登录用户</option><option value="selected" ${d.mode==='selected'?'selected':''}>项目成员与指定用户</option></select></label>${d.mode==='selected'?`<fieldset class="cs-visibility-choices" aria-describedby="cs-visibility-error" aria-invalid="${Boolean(s.visibilityError)}"><legend>指定用户（至少选择一位）</legend>${demoUsers.map(u=>`<label class="cs-check"><input type="checkbox" id="cs-visible-${u.id}" data-visible-user="${u.id}" ${d.users.includes(u.id)?'checked':''}><span>${u.name} <span class="cs-small cs-muted">${u.email}</span></span></label>`).join('')}<p class="cs-small cs-muted">选择已注册用户；项目成员始终可见。</p></fieldset>`:''}<div id="cs-visibility-error" class="cs-form-error" role="alert">${esc(s.visibilityError)}</div><p class="cs-small cs-muted">市场可见性不授予开发、上线或 API 调用权限。</p><div class="cs-row"><button type="submit" class="cs-button cs-primary">保存可见性</button>${btn('取消修改','cancel-visibility')}</div></form><div class="cs-rule"></div><label>检查已保存的可见效果<select id="cs-visibility-preview">${demoUsers.map(u=>`<option value="${u.id}" ${u.id===s.visibilityPreview?'selected':''}>${u.name} · ${u.id==='mei'?'非项目成员':'项目成员'}</option>`).join('')}</select></label><div class="cs-callout" role="status">${esc(person.name)}${canSeeApp(app,person.id==='mei'?'viewer':person.id==='chen'?'developer':'tester',person.id)?'可以':'无法'}在能力市场查看此应用。</div>`:''}</section>`;}
function legacyView(){return heading('历史对话会话','旧版结构化会话，可继续原有消息；当前 CLI 在后台运行。',btn('返回 CLI 工作区','back-cli',true))+`<div class="cs-callout cs-small" style="margin-bottom:12px">这里的历史会话与 CLI 是独立的执行对象。</div>${s.newAgent?newAgentForm():''}${chatPanel(s.agent)}`;}
function adminCapabilities(){return heading('能力接入','接入公司系统，维护平台向团队提供的能力。')+tabs([['integrations','接入容器'],['api','接口开放策略'],['events','事件来源']],'adminCapTab')+(s.adminCapTab==='integrations'?`<div class="cs-stack"><div>${btn('新建接入容器','admin-create',true)}</div>${s.adminCreate?createForm():''}${s.created?'<div class="cs-banner" role="status">创建已受理（演示），未创建真实项目。</div>':''}<section class="cs-panel cs-pad"><div class="cs-row cs-spread"><div><h2>参考 API 代理</h2><p class="cs-small cs-muted">reference-api-proxy · APIProxy · v0.1.2</p></div>${btn('进入接入容器','integration-detail')}</div><div id="cs-integration-detail"></div></section></div>`:s.adminCapTab==='api'?`<section class="cs-panel cs-pad"><h2>接口开放策略</h2>${[['读取问题详情','GET /issues/{id}','default'],['创建合入请求','POST /merge_requests','targeted']].map(([label,path,id])=>`<div class="cs-line cs-row cs-spread"><div><strong>${label}</strong><div class="cs-small cs-muted">${path}</div></div><div class="cs-row">${tag(s.apiPolicies[id]==='default'?'默认开放':'定向开放')}<button class="cs-button" data-api-policy="${id}">改为${s.apiPolicies[id]==='default'?'定向':'默认'}开放</button></div></div>`).join('')}<button class="cs-link" data-admin="requests">处理接口使用申请 →</button></section>`:`<section class="cs-panel cs-pad"><h2>事件来源</h2><div class="cs-line"><strong>GitLab 事件接收器</strong><p class="cs-small cs-muted">EventProducer · gitlab.merge_request · 已登记</p></div><button class="cs-button" data-tab="adminCapTab:integrations">管理接入容器</button></section>`);}
function projects(){return heading('数字人项目','构建、发布并持续改进团队自己的数字人。')+`<div class="cs-row" style="margin-bottom:18px"><label class="cs-grow">搜索项目<input id="cs-project-search" type="search" placeholder="名称或标识" value="${esc(s.query)}"></label></div><div class="cs-panel cs-pad" id="cs-project-results">${projectResults()}</div>`;}
function projectResults(){if(s.role==='viewer')return '<div class="cs-empty"><h2>尚未参与数字人项目</h2><p class="cs-muted">可从能力市场使用已开放的应用。</p><button class="cs-button" data-view="market">浏览能力市场</button></div>';return '问题单助手 demo'.includes(s.query.toLowerCase())?`<div class="cs-row cs-spread"><div><h2>问题单助手</h2><p class="cs-muted">demo · 负责人：林晓（示例）</p><div class="cs-row">${tag('已开通','good')}${tag('正式 '+s.current)}${tag(s.sessionOpen?'有开发会话':'尚无开发会话')}</div></div><div class="cs-row"><button class="cs-button" data-view="overview">项目概览</button><button class="cs-button cs-primary" data-view="dev">${s.sessionOpen?'继续开发':'开始开发'}</button></div></div>`:`<div class="cs-empty"><h2>没有匹配的项目</h2><p class="cs-muted">试试项目名称“问题单助手”或标识“demo”。</p>${btn('清除搜索','clear-search')}</div>`;}
function overview(){return heading('问题单助手','让团队从一个入口处理问题单，持续跟进修改结果。',editable()?'<button class="cs-button cs-primary" data-view="dev">'+(s.sessionOpen?'继续开发':'开始开发')+' →</button>':'')+`<div class="cs-stack"><div class="cs-banner"><span class="cs-avatar">↗</span><div class="cs-grow"><strong>${s.candidate} ${isOlder()?'保留在待命槽，可回退':'已发布，等待验证'}</strong><div class="cs-small cs-muted">打开试用版本，验证后由负责人正式上线。</div></div><button class="cs-link" data-view="release">查看版本 →</button></div><div class="cs-grid">${versionCard('正式版本',s.current,true)}${versionCard(isOlder()?'可回退版本':'待验证版本',s.candidate,false)}</div><section class="cs-panel cs-pad"><div class="cs-row cs-spread"><h2>当前开发</h2>${tag(s.sessionOpen?'会话已连接':'尚未开启',s.sessionOpen?'good':'')}</div><div class="cs-line cs-row cs-spread"><div><strong>main</strong><span class="cs-muted"> · ${s.dirty?'有未提交改动':'2 个提交尚未推送'} · 林晓开启</span><div class="cs-small cs-muted">开发预览使用开发数据；关闭页面后会话继续保留。</div></div><button class="cs-link" data-view="dev">进入开发 →</button></div><details><summary>项目技术详情</summary><div class="cs-small cs-muted">标识 demo · 命名空间 cs-demo · 仓库 crewstation/demo</div><code>项目 ID：prj_example_demo</code></details></section><section><h2>最近活动</h2><div class="cs-line cs-row cs-spread"><div>${tag('发布','good')} ${s.candidate} 已部署到待命槽</div><button class="cs-link" data-view="release">查看发布</button></div><div class="cs-line cs-row cs-spread"><div>${tag('历史失败','error')} v0.1.1 构建失败</div>${btn('查看失败日志','logs')}</div></section></div>`;}
function versionCard(title,version,active){const sha=version==='v0.1.2'?'3975d02':'9fd01fc';return `<section class="cs-panel cs-pad"><div class="cs-row cs-spread"><h2>${title}</h2>${tag(active?'正在服务':'待命槽','good')}</div><div class="cs-version">${version}</div><div class="cs-small cs-muted">${sha} · main · 1/1 副本就绪</div><div class="cs-rule"></div><div class="cs-row cs-spread"><span class="cs-small cs-muted">${active?'demo.example.test':'preview.demo.example.test'}</span>${btn(active?'打开正式应用 ↗':'打开试用版本 ↗',active?'open-prod':'open-trial')}</div></section>`;}
function dev(){
 if(!editable())return heading('开发','当前为 preview 测试者视角。')+`<div class="cs-panel cs-empty"><h2>试用待验证版本</h2><p class="cs-muted">此演示角色没有开发操作权限。</p>${btn('打开试用版本','open-trial',true)}</div>`;
 if(!s.sessionOpen)return heading('开始开发','选择工作分支，开启本项目的开发会话。')+`<div class="cs-panel cs-pad cs-stack"><label>工作分支<select id="cs-session-branch"><option value="main">main · 默认分支</option><option value="feature/preview">feature/preview · 与正式版本暂不可比较</option></select></label><div class="cs-callout">开发预览默认使用开发数据。已有正式版本 ${s.current} 继续服务。</div>${btn('开启开发会话','open-session',true)}</div>`;
 return `<div class="cs-dev-heading"><h1>开发</h1><span class="cs-small cs-muted">${esc(s.branch)} @ ${s.sourceVersion}</span><span class="cs-grow"></span><button class="cs-button" data-action="toggle-data" aria-expanded="${s.dataOpen}">${icon('database')} 数据访问${Object.values(s.dataStates).some(v=>v!=='none')?' · 有生产申请':' · 开发数据'}</button>${btn('准备发布 →','prepare',true)}<button class="cs-link cs-small" data-action="session-details">会话</button></div>`+comparisonStrip()+`${s.scenario==='disconnected'?'<div class="cs-readonly">连接已断开，窗口与输入已保留，等待附着原进程。</div>':''}${s.dataOpen?dataAccessPanel():''}${s.releaseSessionOpen?sessionDetails():''}`+workTabBar()+`<div id="cs-work-content" role="tabpanel" aria-label="开发工作内容">`+(s.devView==='cli'?cliWorkspace():s.devView==='split'?`<div class="cs-cli-split"><div>${cliWorkspace()}</div><section class="cs-panel">${devPreview()}</section></div>`:s.devView==='preview'?`<section class="cs-panel cs-preview-standalone">${devPreview()}</section>`:s.devView==='code'?`<section class="cs-panel">${editor()}</section>`:s.devView==='diff'?comparisonDetails():cliWorkspace())+`</div><div class="cs-dev-footer"><span>${s.cli.length} CLI · ${s.scenario==='disconnected'?'状态待确认':activityCounts(s.cli).working+' 执行中'} · 共享工作树</span><span class="cs-grow"></span><button class="cs-link" data-action="terminal">${s.terminal?'收起 shell':'普通 shell'}</button><button class="cs-link" data-action="dev-logs">会话日志</button></div>${s.terminal?`<pre>普通 shell · 演示记录\n$ git status --short\n${s.dirty?' M src/Welcome.tsx':'工作区无未提交改动'}</pre>`:''}`;
}
function comparisonFacts(){
 const version=s.compareTarget==='prod'?s.current:s.candidate;const sha=version==='v0.1.2'?'3975d02':'9fd01fc';
 const state=s.compareScenario==='auto'?(sha===s.sourceVersion?'equal':'ahead'):s.compareScenario;
 const counts={equal:[0,0],ahead:[2,0],behind:[0,1],diverged:[2,1]};
 return {version,sha,state,counts:counts[state],label:s.compareTarget==='prod'?'正式部署':'待验证部署'};
}
function comparisonStrip(){const f=comparisonFacts();return `<div class="cs-version-strip" aria-label="工作树与部署版本对比"><span>${f.label} ${f.state==='undeployed'?'尚未部署':`${f.version} <code>@ ${f.sha}</code>`}</span>${f.counts?`<span>${s.compareTarget==='prod'?'已提交待上线':'已提交待试用'} <strong>${f.counts[0]}</strong> · 缺少部署提交 <strong>${f.counts[1]}</strong></span>${f.state==='diverged'?tag('历史已分叉','warning'):''}`:tag(f.state==='undeployed'?'尚无部署基线':f.state==='unrelated'?'无共同历史':'暂不可比较','warning')}<span>未提交 <strong>${s.dirty?1:0}</strong> 文件</span><span class="cs-muted">未推送 ${s.unpushed}</span><button class="cs-link" data-action="view-diff">查看差异 ↗</button></div>`;}
function workTabBar(){return `<div class="cs-work-tabs" role="tablist" aria-label="开发工作页签">${s.workTabs.map(t=>`<span class="cs-work-tab ${s.activeWork===t.id&&(s.devView==='cli'||s.devView==='split')?'cs-active':''}"><button role="tab" id="tab-${t.id}" aria-controls="cs-work-content" aria-selected="${s.activeWork===t.id&&(s.devView==='cli'||s.devView==='split')}" data-work-tab="${t.id}">${esc(t.name)} <span class="cs-muted">${t.ids.length}</span>${tabActivity(t)}</button><button class="cs-tab-close" aria-label="关闭页签 ${esc(t.name)}" data-close-work="${t.id}">×</button></span>`).join('')}<button data-action="new-work-tab" aria-label="新建工作页签">＋ 新页签</button><span class="cs-grow"></span>${[['preview','预览'],['code','代码'],['diff','差异']].map(([id,label])=>`<span class="cs-work-tab ${s.devView===id?'cs-active':''}"><button role="tab" id="tab-${id}" aria-controls="cs-work-content" aria-selected="${s.devView===id}" data-tab="devView:${id}">${label}</button></span>`).join('')}</div>`;}
function newWorkTab(){const id='work-'+(++s.workSerial);s.workTabs.push({id,name:'开发 '+s.workSerial,layout:'grid',x:50,y:50,ids:[]});s.activeWork=id;s.devView='cli';s.cliFocus='';s.tabRename=false;return id;}
function moveCli(c,id){for(const t of s.workTabs)t.ids=t.ids.filter(v=>v!==c.id);const target=s.workTabs.find(t=>t.id===id);if(target){target.ids.push(c.id);c.hidden=false;}else c.hidden=true;s.cliFocus='';s.cliMenu='';}
function cliWorkspace(){
 const t=workTab(),all=t.ids.map(id=>s.cli.find(c=>c.id===id)).filter(Boolean),visible=all.filter(c=>!s.cliFocus||s.cliFocus===c.id);
 const style=`--cs-x:${t.x};--cs-y:${t.y};--cs-left:${t.x}fr;--cs-right:${100-t.x}fr;--cs-top-row:${t.y}fr;--cs-bottom-row:${100-t.y}fr;${t.layout==='columns'&&visible.length>1?`grid-template-columns:minmax(0,${t.x}fr) repeat(${visible.length-1},minmax(0,${(100-t.x)/(visible.length-1)}fr));`:''}`;
 return `<div class="cs-cli-tools">${btn(s.cliLaunching?'正在启动…':'＋ CLI','launch-cli',true,s.cliLaunching||s.scenario==='disconnected')}<label>算力<select id="cs-cli-compute" aria-label="新 CLI 算力档位"><option ${s.cliCompute==='balanced'?'selected':''}>balanced</option><option ${s.cliCompute==='deep'?'selected':''}>deep</option></select></label><button class="cs-link cs-small" data-action="cli-settings">高级</button><span class="cs-grow"></span><div class="cs-layout-options" aria-label="当前页签布局">${[['columns','横排'],['rows','纵排'],['grid','网格']].map(([id,label])=>`<button class="cs-button" data-layout="${id}" aria-pressed="${t.layout===id}">${label}</button>`).join('')}<button class="cs-button" data-action="equal-panes">均分</button></div><button class="cs-button" data-action="toggle-split">${s.devView==='split'?'收起并排预览':'并排预览'}</button><button class="cs-button" data-action="cli-shelf">已启动 ${s.cli.length}</button></div>${s.cliSettings?`<div class="cs-inline-tools cs-row"><label class="cs-small">新 CLI 的 Agent 操作权限<select id="cs-cli-permission">${['可改文件','只读','完全权限'].map(v=>`<option ${s.cliPermission===v?'selected':''}>${v}</option>`).join('')}</select></label><span class="cs-small cs-muted">控制文件与工具操作；数据访问由会话共享。</span>${btn('重命名当前页签','rename-work')}</div>`:''}${s.tabRename?`<form class="cs-inline-tools cs-row" data-form="rename-work"><label class="cs-small">页签名称（1–24 字）<input name="name" aria-label="页签名称" maxlength="24" value="${esc(t.name)}"></label><button class="cs-button" type="submit">保存名称</button></form>`:''}${s.cliShelf?cliShelf():''}${s.cliFocus?`<div class="cs-cli-tools">${btn('退出放大','unfocus-cli')}<span class="cs-small cs-muted">其他 CLI 继续运行</span></div>`:''}${s.cliError?`<div class="cs-form-error" role="alert">${esc(s.cliError)}</div>`:''}${visible.length?`<div class="cs-cli-grid ${s.cliFocus?'cs-cli-focus':''} ${visible.length>4?'cs-many':''}" data-layout="${t.layout}" data-count="${visible.length}" style="${style}">${visible.map(cliWindow).join('')}${visible.length>1&&!s.cliFocus&&t.layout!=='rows'?paneGrip('x',t.x):''}${!s.cliFocus&&((t.layout==='grid'&&visible.length>2&&visible.length<=4)||(t.layout==='rows'&&visible.length===2))?paneGrip('y',t.y):''}</div>`:`<div class="cs-panel cs-cli-empty"><strong>这个页签还没有 CLI</strong><span class="cs-small">从上方新增一个，或放入已启动的 CLI。</span>${btn('选择已启动的 CLI','cli-shelf')}</div>`}`;
}
function paneGrip(axis,value){return `<button type="button" role="separator" aria-orientation="${axis==='x'?'vertical':'horizontal'}" aria-valuemin="25" aria-valuemax="75" aria-valuenow="${value}" aria-label="${axis==='x'?'调整左右宽度':'调整上下高度'}" class="cs-grip cs-grip-${axis}" data-resize="${axis}"></button>`;}
function cliShelf(){return `<div class="cs-inline-tools"><div class="cs-row cs-spread"><strong class="cs-small">全部 CLI · 放入当前页签不会新启进程</strong>${btn('收起列表','cli-shelf')}</div>${s.cli.map(c=>{const t=s.workTabs.find(w=>w.ids.includes(c.id));return `<div class="cs-data-row"><span>Agent ${c.id} · ${t?esc(t.name):'已收起'} · ${activityLabel(c)}</span><button class="cs-button" data-cli-restore="${c.id}" ${t?.id===s.activeWork?'disabled':''}>放入当前页签</button></div>`;}).join('')}</div>`;}
function cliWindow(c){return `<section class="cs-panel cs-cli-window" aria-label="Agent ${c.id} CLI"><div class="cs-panel-head"><div class="cs-row"><strong>Agent ${c.id}</strong>${tag(activityLabel(c),activityTone(c))}<span class="cs-muted cs-cli-compute">${esc(c.compute)}</span></div><div class="cs-row"><button class="cs-icon-button" aria-label="放大 Agent ${c.id}" data-cli-focus="${c.id}">${icon('maximize-2')}</button><button class="cs-icon-button" aria-label="收起 Agent ${c.id}" data-cli-hide="${c.id}">${icon('minus')}</button><button class="cs-icon-button" aria-label="Agent ${c.id} 更多操作" data-cli-menu="${c.id}">${icon('ellipsis')}</button></div></div>${s.cliMenu===c.id?`<div class="cs-cli-menu"><label>移至<select aria-label="移动 Agent ${c.id} 到页签" data-cli-move="${c.id}">${s.workTabs.map(t=>`<option value="${t.id}" ${t.ids.includes(c.id)?'selected':''}>${esc(t.name)}</option>`).join('')}<option value="new">新页签…</option></select></label><button class="cs-link" data-cli-before="${c.id}">向前</button><button class="cs-link" data-cli-after="${c.id}">向后</button><button class="cs-link cs-danger" data-cli-stop="${c.id}">结束进程</button></div>`:''}${c.activity==='attention'&&c.state==='running'?`<div class="cs-cli-attention">${esc(c.summary)}</div>`:''}<div class="cs-cli-screen">${c.lines.map(line=>`<p>${esc(line)}</p>`).join('')}</div>${c.state==='running'?`<form class="cs-cli-input" data-form="cli-input" data-cli-id="${c.id}" novalidate><input aria-label="Agent ${c.id} CLI 输入" data-cli-draft="${c.id}" name="input" value="${esc(c.draft)}" placeholder="输入任务或命令…" ${s.scenario==='disconnected'?'disabled':''}><button type="submit" aria-label="发送到 Agent ${c.id}" class="cs-button" ${s.scenario==='disconnected'?'disabled':''}>↵</button><button class="cs-button" type="button" aria-label="中断 Agent ${c.id} 当前运行" data-cli-interrupt="${c.id}">^C</button></form>`:c.state==='failed'?`<div class="cs-cli-menu"><button class="cs-button" data-cli-retry="${c.id}">重试此 CLI</button></div>`:''}${s.cliStop===c.id?`<div class="cs-cli-menu">结束 Agent ${c.id}？<button class="cs-button" data-cli-end="${c.id}">确认结束</button>${btn('取消','cancel-cli-stop')}</div>`:''}</section>`;}
function startCli(){
 if(s.cliLaunching)return;
 s.cliError='';s.cliLaunching=true;s.cliFocus='';const id=String(++s.cliSerial);const c={id,state:'starting',activity:'idle',unread:false,turn:0,summary:'等待输入任务',compute:s.cliCompute,permission:s.cliPermission,draft:'',hidden:false,lines:['正在准备原生 CLI…（演示）']};s.cli.push(c);workTab().ids.push(id);const fail=s.cliFail;s.cliFail=false;
 render();setTimeout(()=>{if(!s.sessionOpen){c.state='exited';c.lines=['开发会话已释放（示例）。'];}else{c.state=fail?'failed':'running';c.lines=fail?['启动失败（示例）：CLI 进程未能启动。','已有 CLI 继续运行。']:[`Agent ${c.id} · 原生 CLI 窗口示意`,`${c.compute} · ${c.permission} · /work · ${s.branch}`,'已连接。请在此窗口输入任务。'];}s.cliLaunching=false;render();announce(c.state==='exited'?'会话已释放，此 CLI 已结束（演示）。':c.state==='failed'?'新增 CLI 启动失败（演示），已有 CLI 保留。':`仅新增 Agent ${c.id}（演示），已有 CLI 与输入保持。`);},400);
}
function dataAccessPanel(){return `<section class="cs-inline-tools" aria-label="会话数据访问"><div class="cs-row cs-spread"><strong>数据访问</strong><span class="cs-small cs-muted">全页签、全部 CLI 共享 · 不自动切换应用数据源</span></div><div class="cs-data-row"><span><strong>开发数据</strong> · 可读写 · 独立开发库，跨会话保留</span>${tag('默认可用','good')}</div>${Object.entries(dataNames).map(([mode,name])=>{const state=s.dataStates[mode];return `<div class="cs-data-row"><span><strong>${name}</strong> · ${state==='none'?'未申请':state==='requested'?'等待负责人批准':state==='approved'?'已批准 · 待确认进程接入':'已拒绝'}</span>${state==='none'||state==='rejected'?`<button class="cs-button" data-request-data="${mode}">申请访问</button>`:state==='requested'&&owner()?`<div class="cs-row"><button class="cs-button" data-approve-data="${mode}">批准</button><button class="cs-link" data-reject-data="${mode}">拒绝</button></div>`:''}</div>`;}).join('')}${s.dataRequest?`<form class="cs-form" data-form="request-data" novalidate><strong class="cs-small">申请${dataNames[s.dataRequest]}</strong><div class="cs-row"><label class="cs-small cs-grow">用途（可选，最多 500 字）<input id="cs-data-reason" name="reason" aria-label="数据访问用途" aria-describedby="cs-data-reason-error" value="${esc(s.dataReason)}"><span class="cs-form-error" id="cs-data-reason-error" role="alert"></span></label><label class="cs-small">有效时长（5–1440 分钟）<input id="cs-data-ttl" type="number" name="ttl" aria-label="数据访问有效分钟" aria-describedby="cs-data-ttl-error" value="${esc(s.dataTtl)}"><span class="cs-form-error" id="cs-data-ttl-error" role="alert"></span></label></div><div class="cs-form-error" id="cs-data-error" role="alert"></div><div class="cs-row"><button class="cs-button cs-primary" type="submit">提交申请</button>${btn('取消','cancel-data')}</div></form>`:''}</section>`;}
function comparisonDetails(){const f=comparisonFacts();let content='';if(!f.counts)content=`<div class="cs-callout cs-warning">${f.state==='undeployed'?'尚无正式部署，无法计算版本差距。':f.state==='unrelated'?'当前工作树与目标部署没有共同历史。':'Git 历史不完整或对象不可读，暂不可比较；不能按 0 显示。'}</div>`;else if(s.diffTab==='ahead')content=f.counts[0]?`<div class="cs-line"><code>9fd01fc</code> 增加问题单详情</div><div class="cs-line"><code>83bd012</code> 优化列表展示</div><p class="cs-small cs-muted">此处列出工作树 HEAD 独有、部署尚未包含的提交（示例）。</p>`:'<div class="cs-empty">没有已提交但未包含在此部署中的修改。</div>';else if(s.diffTab==='behind')content=f.counts[1]?'<div class="cs-line"><code>7a52e10</code> 生产紧急修复（示例）</div><p>当前工作树尚未包含此提交，平台不会自动覆盖工作树。</p>':'<div class="cs-empty">当前工作树没有缺少的部署提交。</div>';else if(s.diffTab==='working')content=s.dirty?`<p>${tag('未暂存','warning')} <code>src/Welcome.tsx</code></p>${diffExample()}<p class="cs-small cs-muted">已暂存 0 · 未暂存 1 · 未跟踪 0。未提交内容不计入提交数量。</p>`:'<div class="cs-empty">已暂存、未暂存与未跟踪文件均为 0（示例）。</div>';else content=f.counts[0]||f.counts[1]||s.dirty?`<p><code>src/Welcome.tsx</code> · 相对 ${f.label} 的文件净差异（示例）</p>${diffExample()}<p class="cs-small cs-muted">文件视图包含工作树已保存的内容；二进制、重命名与未跟踪文件在正式实现中单列。</p>`:'<div class="cs-empty">文件内容与目标部署一致。</div>';return `<section class="cs-panel cs-pad"><div class="cs-row cs-spread"><h2>工作树与部署差异</h2><label>比较目标<select id="cs-compare-target" aria-label="比较目标"><option value="prod" ${s.compareTarget==='prod'?'selected':''}>正式部署</option><option value="preview" ${s.compareTarget==='preview'?'selected':''}>待验证部署</option></select></label></div><p class="cs-small cs-muted">${f.label} ${f.state==='undeployed'?'尚未部署':f.version+' @ '+f.sha} → ${s.branch} @ ${s.sourceVersion}${s.dirty?' ＋ 未提交改动':''}</p>${tabs([['ahead',s.compareTarget==='prod'?'待上线提交':'待试用提交'],['behind','缺少的部署提交'],['files','文件差异'],['working','未提交改动']],'diffTab')}${content}</section>`;}
function diffExample(){return `<div class="cs-diff-block"><span class="cs-diff-remove">− &lt;p&gt;提交问题单&lt;/p&gt;</span><br><span class="cs-diff-add">+ &lt;p&gt;跟进问题单，按状态筛选&lt;/p&gt;</span></div>`;}
function newAgentForm(){return `<section class="cs-panel cs-pad" style="margin-top:14px"><form class="cs-form" data-form="new-agent" novalidate><div class="cs-row cs-spread"><h2>新建旧版对话会话</h2>${btn('取消','cancel-new-agent')}</div><div class="cs-grid"><label>算力档位<select name="compute"><option>balanced</option><option>deep</option></select></label><label>Agent 操作权限<select name="permission"><option>可改文件</option><option>只读</option><option>完全权限</option></select></label></div><label>首条指令<textarea name="prompt" placeholder="描述希望这个 Agent 完成的工作"></textarea><small>必填；启动新 Agent 不会中止已有会话。</small></label><div id="cs-agent-error" class="cs-form-error" role="alert"></div><div><button class="cs-button cs-primary" type="submit">启动 Agent</button></div></form></section>`;}
function chatPanel(id){return `<section class="cs-chat cs-panel"><div class="cs-panel-head"><div class="cs-row"><span class="cs-avatar">A</span><label><span class="cs-small cs-muted">历史会话</span><select class="cs-select-compact" aria-label="选择历史对话会话" data-agent-select>${s.agents.map(a=>`<option value="${a}" ${a===id?'selected':''}>历史会话 L-${a} · 等待输入</option>`).join('')}</select></label></div>${btn('新建旧版对话会话','new-agent')}</div><div class="cs-transcript">${id==='1'?`<div class="cs-message cs-user">在问题列表里区分“待处理”和“处理中”，让大家能更快找到自己的问题。</div><div class="cs-message"><strong>历史会话 L-${id}</strong><p>列表状态与筛选已调整。可返回 CLI 工作区，从预览页签检查效果。</p><button class="cs-link" data-action="show-code">查看 src/Welcome.tsx →</button></div>`:''}${(s.messages[id]||[]).map(m=>`<div class="cs-message ${m.user?'cs-user':''}">${esc(m.text)}</div>`).join('')}</div><form class="cs-composer" data-form="chat" data-agent="${id}"><textarea aria-label="发给 历史会话 L-${id} 的消息" name="message" placeholder="描述下一处想改进的地方…" data-draft="${id}">${esc(s.drafts[id]||'')}</textarea><div class="cs-row cs-spread"><span class="cs-small cs-muted">${esc(s.agentMeta[id].compute)} · ${esc(s.agentMeta[id].permission)}</span><button class="cs-button cs-primary" type="submit" ${s.scenario==='disconnected'?'disabled':''}>发送 ↑</button></div></form></section>`;}
function devPreview(){return `<div class="cs-panel-head"><div><strong>实时开发预览</strong><div class="cs-small cs-muted">${s.branch} · 当前工作树 · dev.demo.example.test</div></div><div class="cs-row">${tag('开发数据')}${btn('刷新','refresh-preview')}</div></div><div class="cs-preview">${s.scenario==='preview-failed'?`<div class="cs-empty"><h2>预览进程已退出</h2><p class="cs-muted">代码和 CLI 仍可继续使用。</p><div class="cs-row">${btn('查看预览日志','dev-logs')}${btn('重启预览','restart-preview',true)}</div></div>`:`${s.previewEdited?'<div class="cs-callout" role="status"><strong>按状态筛选</strong><p>全部 · 待处理 · 已完成</p><span class="cs-small cs-muted">示例工作树已修改，此处展示更新后的效果。</span></div>':''}${businessPreview()}`}</div>`;}

function sessionDetails(){return `<section class="cs-panel cs-pad" style="margin-top:12px"><div class="cs-row cs-spread"><strong>开发会话 · 林晓开启 · main</strong>${btn('收起','session-details')}</div><p class="cs-small cs-muted">关闭页面会保留会话。释放会删除开发容器与工作区。</p><details style="margin-bottom:10px"><summary>历史对话会话</summary><p class="cs-small cs-muted">查看或继续旧版结构化会话；与当前 CLI 分开。</p>${btn('打开历史对话会话','legacy')}</details><div class="cs-callout cs-warning">释放前检查：${s.scenario==='disconnected'?'无法确认未推送内容，请恢复连接后再检查。':s.dirty?'src/Welcome.tsx 有未提交改动。':'有 2 个未推送提交：调整状态筛选、补充空态。'}<br>这是示例清单。实际操作前需要保存并推送你要保留的内容。</div><div class="cs-row" style="margin-top:12px">${btn('保留会话','session-details')}${btn('确认丢弃并释放','release-session',false,s.scenario==='disconnected')}</div></section>`;}
function isOlder(){return Number(s.candidate.split('.').at(-1))<Number(s.current.split('.').at(-1));}
function release(){return heading('发布与上线','明确发布的代码，验证后再交给团队使用。',editable()?btn('准备新版本','prepare',true,s.publishing):'')+`<div class="cs-stack">${s.prepare?publishForm():''}${s.publishing?`<section class="cs-panel cs-pad" role="status"><h2>${esc(s.version)} 正在构建</h2><p class="cs-muted">代码已受理，正式版本 ${s.current} 继续服务。</p>${steps(3)}</section>`:''}<div class="cs-grid">${versionCard('正式版本',s.current,true)}${versionCard(isOlder()?'可回退版本':'待验证版本',s.candidate,false)}</div><div class="cs-callout cs-warning">试用版本与正式版本共用生产数据库和文件；开发预览默认使用开发数据。</div><section class="cs-panel cs-pad"><div class="cs-row cs-spread"><div><h2>${isOlder()?'回退到':'上线'} ${s.candidate}</h2><p class="cs-muted">${isOlder()?'此版本仍保留在待命槽。':'先打开试用版本验证，再确认正式上线。'}</p></div>${owner()?btn(isOlder()?'回退到 '+s.candidate:'正式上线','ask-switch',!isOlder(),s.publishing):tag('由项目负责人操作','warning')}</div>${s.confirm==='switch'?`<div class="cs-callout"><strong>确认${isOlder()?'回退':'上线'}：${s.current} → ${s.candidate}</strong><p class="cs-small cs-muted">正式访问地址保持不变，流量切换到 ${s.candidate}。生产数据不会随版本回退。</p><div class="cs-row">${btn('取消','cancel-switch')}${btn('确认切换正式版本','switch',true)}</div></div>`:''}${steps(6)}</section><section class="cs-panel"><div class="cs-panel-head"><h2>发布记录</h2><span class="cs-small cs-muted">按版本追踪结果</span></div><div class="cs-pad cs-table-wrap"><table><thead><tr><th>版本</th><th>结果</th><th>源码</th><th>下一步</th></tr></thead><tbody><tr><td>${s.candidate}</td><td>${tag('待命槽就绪','good')}</td><td><code>main · ${s.candidate==='v0.1.2'?'3975d02':'9fd01fc'}</code></td><td>${btn('打开试用','open-trial')}</td></tr><tr><td>${s.current}</td><td>${tag('正式服务','good')}</td><td><code>main · ${s.current==='v0.1.2'?'3975d02':'9fd01fc'}</code></td><td>${btn('查看运行状态','health')}</td></tr><tr><td>v0.1.1</td><td>${tag('构建失败','error')}</td><td><code>main · 3975d02</code></td><td>${btn('查看失败日志','logs')}</td></tr></tbody></table></div></section></div>`;}

root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.type==='submit'&&b.getAttribute('type')==='submit'&&b.form){e.preventDefault();b.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}
 if(!b.getAttribute('type'))e.preventDefault();
 const cliKey=['cliFocus','cliHide','cliRestore','cliInterrupt','cliStop','cliEnd','cliRetry','cliMenu','cliBefore','cliAfter'].find(k=>b.dataset[k]);
 if(cliKey){if(s.scenario==='disconnected'&&['cliInterrupt','cliEnd','cliRetry'].includes(cliKey)){announce('连接中断，恢复连接后再操作。');return;}const c=s.cli.find(item=>item.id===b.dataset[cliKey]);if(!c)return;if(cliKey==='cliFocus'){s.cliFocus=s.cliFocus===c.id?'':c.id;c.unread=false;}if(cliKey==='cliHide'){moveCli(c,'');announce(`Agent ${c.id} 已收起，进程保留，可从“已启动”放回。`);}if(cliKey==='cliRestore')moveCli(c,s.activeWork);if(cliKey==='cliMenu')s.cliMenu=s.cliMenu===c.id?'':c.id;if(cliKey==='cliBefore'||cliKey==='cliAfter'){const ids=workTab().ids,i=ids.indexOf(c.id),j=i+(cliKey==='cliBefore'?-1:1);if(j>=0&&j<ids.length)[ids[i],ids[j]]=[ids[j],ids[i]];}if(cliKey==='cliInterrupt'){c.turn++;c.activity='interrupted';c.unread=false;c.summary='已中断当前轮次，CLI 保留';c.lines.push('^C','已中断当前运行（示例），CLI 进程保留。');announce('Agent '+c.id+' 已中断当前轮次，CLI 保留。');}if(cliKey==='cliStop')s.cliStop=c.id;if(cliKey==='cliEnd'){c.state='exited';c.activity='exited';c.turn++;c.unread=false;c.summary='CLI 进程已结束';c.lines.push('[进程已结束 · 示例]');s.cliStop='';announce('Agent '+c.id+' 进程已结束（演示）。');}if(cliKey==='cliRetry'){c.state='running';c.activity='idle';c.unread=false;c.lines.push('仅此窗口重试成功（示例）。请继续输入。');}render();return;}
 if(b.dataset.openActivity){const c=s.cli.find(v=>v.id===b.dataset.openActivity);if(c){openActivity(c);render();}return;}

root.addEventListener('keydown',e=>{const grip=e.target.closest('[data-resize]');if(!grip)return;const axis=grip.dataset.resize,delta={ArrowLeft:-5,ArrowUp:-5,ArrowRight:5,ArrowDown:5}[e.key];if(delta!==undefined){e.preventDefault();resizePanes(axis,workTab()[axis]+delta,grip.closest('.cs-cli-grid'));}});

if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{if(s.role==='viewer'&&!['market','marketDetail','marketApp','brand'].includes(s.view)){s.view='market';s.admin=false;}if(s.role!=='admin'&&s.admin){s.admin=false;s.view=s.lastView;}if(s.scenario==='dirty')s.dirty=true;if(s.scenario==='normal')s.dirty=false;render();}});t.addSelect(s,'role',{label:'演示身份',options:[{value:'viewer',label:'应用使用者（非项目成员）'},{value:'owner',label:'项目负责人'},{value:'developer',label:'开发者'},{value:'tester',label:'preview 测试者'},{value:'admin',label:'管理员'}]});t.addSelect(s,'scenario',{label:'开发场景',options:[{value:'normal',label:'正常'},{value:'dirty',label:'存在未提交改动'},{value:'preview-failed',label:'预览失败'},{value:'disconnected',label:'连接断开'}]});t.addSelect(s,'compareScenario',{label:'版本关系示例',options:[{value:'auto',label:'跟随部署版本'},{value:'diverged',label:'双方都有新提交'},{value:'behind',label:'工作树落后'},{value:'unavailable',label:'无法读取历史'},{value:'unrelated',label:'无共同历史'},{value:'undeployed',label:'未首次部署'}]});t.addToggle(s,'cliFail',{label:'下一个 CLI 启动失败'});t.addSelect(s,'nextOutcome',{label:'下次 CLI 输入的演示结果',options:[{value:'complete',label:'执行后完成'},{value:'attention',label:'等待人工输入'},{value:'working',label:'保持执行中'}]});}
})();
</script>
