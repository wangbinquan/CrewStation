<div id="crewstation-ux" aria-label="CrewStation 工作台重设计交互演示">
  <header class="cs-top"><div class="cs-brand"><span class="cs-logo">C</span>CrewStation</div><span class="cs-tag cs-demo-tag">RFC-003 · 交互演示 · 示例数据</span><span class="cs-grow"></span><button class="cs-link" data-action="space">平台管理</button><span class="cs-small cs-muted" id="cs-role">项目负责人</span></header>
  <div class="cs-shell"><aside id="cs-sidebar"></aside><main id="cs-main"></main></div>
  <div class="cs-notice" id="cs-feedback" aria-live="polite">示例项目与操作仅用于体验设计，不连接真实服务。</div>
</div>
<script>
(()=>{
const root=document.getElementById('crewstation-ux');
const main=root.querySelector('#cs-main');
const side=root.querySelector('#cs-sidebar');
const feedback=root.querySelector('#cs-feedback');
const s={view:'overview',lastView:'overview',admin:false,adminPage:'overview',role:'admin',newAgent:false,branch:'main',density:'comfortable',scenario:'normal',tool:'preview',mobile:'chat',terminal:false,agent:'1',parallel:false,agents:['1'],agentMeta:{'1':{compute:'balanced',permission:'可改文件'}},messages:{'1':[]},drafts:{'1':''},dirty:false,code:'export function Welcome() {\n  return (\n    <main>\n      <h1>问题单助手</h1>\n      <p>提交问题单，跟进处理进展。</p>\n    </main>\n  );\n}',current:'v0.1.2',candidate:'v0.1.4',prepare:false,publishing:false,published:false,confirm:'',source:'session',version:'v0.1.5',releaseError:'',opTab:'health',capTab:'api',apiKey:'read',requestState:'available',requestReason:'',decisionReason:'',requestOpen:false,apiResult:'',setting:'members',env:'development',memberOpen:false,members:[],configValues:{development:'欢迎使用问题单助手',production:'欢迎使用团队问题单助手'},adminCreate:false,createStep:1,projectDraft:{name:'',slug:'',owner:'',template:'minimal-sample',kind:'APIProxy'},formErrors:{},created:false,query:'',notice:'',logContext:'v0.1.1',logSource:'build',logFilter:'',sourceVersion:'9fd01fc',sessionOpen:true,releaseSessionOpen:false};
const roles={owner:'项目负责人',developer:'开发者',tester:'preview 测试者',admin:'平台管理员 · 项目负责人'};
const editable=()=>s.role!=='tester';
const owner=()=>s.role==='owner'||s.role==='admin';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(text,action,primary=false,disabled=false)=>`<button class="cs-button ${primary?'cs-primary':''}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;
const nav=(text,view,n)=>`<button data-view="${view}" class="${s.view===view?'cs-active':''}" ${s.view===view?'aria-current="page"':''}>${icon(n)}${text}</button>`;
const tag=(text,tone='')=>`<span class="cs-tag ${tone?'cs-'+tone:''}">${text}</span>`;
const heading=(title,desc,actions='')=>`<div class="cs-heading"><div><h1>${title}</h1><p>${desc}</p></div><div class="cs-row">${actions}</div></div>`;
const tabs=(items,key)=>`<div class="cs-tabs" aria-label="页面内容">${items.map(([value,label])=>`<button data-tab="${key}:${value}" class="${s[key]===value?'cs-active':''}" aria-pressed="${s[key]===value}">${label}</button>`).join('')}</div>`;
function announce(message){feedback.textContent=message;}
function render(){
 root.style.setProperty('--cs-pad',s.density==='compact'?'14px':'20px');
 root.querySelector('#cs-role').textContent=roles[s.role];
 root.querySelector('[data-action=space]').textContent=s.admin?'返回工作台':'平台管理';
 root.querySelector('[data-action=space]').hidden=s.role!=='admin';
 side.innerHTML=s.admin?adminNav():`<button class="cs-link cs-small" data-view="projects">← 数字人项目</button><div class="cs-project"><strong>问题单助手</strong><div class="cs-small cs-muted">demo · 研发工具</div></div><nav class="cs-nav" aria-label="项目导航">${nav('概览','overview','layout-dashboard')}${nav('开发','dev','panel-left')}${nav('发布与上线','release','rocket')}${nav('运行与诊断','operations','activity')}${nav('能力接入','capabilities','blocks')}${nav('项目设置','settings','settings-2')}</nav>`;
 main.innerHTML=s.admin?adminPage():({projects,overview,dev,release,operations,capabilities,settings,trial}[s.view]||overview)();
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
function projects(){return heading('数字人项目','构建、发布并持续改进团队自己的数字人。')+`<div class="cs-row" style="margin-bottom:18px"><label class="cs-grow">搜索项目<input id="cs-project-search" type="search" placeholder="名称或标识" value="${esc(s.query)}"></label></div><div class="cs-panel cs-pad" id="cs-project-results">${projectResults()}</div>`;}
function projectResults(){return '问题单助手 demo'.includes(s.query.toLowerCase())?`<div class="cs-row cs-spread"><div><h2>问题单助手</h2><p class="cs-muted">demo · 负责人：林晓（示例）</p><div class="cs-row">${tag('已开通','good')}${tag('正式 '+s.current)}${tag(s.sessionOpen?'有开发会话':'尚无开发会话')}</div></div><div class="cs-row"><button class="cs-button" data-view="overview">项目概览</button><button class="cs-button cs-primary" data-view="dev">${s.sessionOpen?'继续开发':'开始开发'}</button></div></div>`:`<div class="cs-empty"><h2>没有匹配的项目</h2><p class="cs-muted">试试项目名称“问题单助手”或标识“demo”。</p>${btn('清除搜索','clear-search')}</div>`;}
function overview(){return heading('问题单助手','让团队从一个入口处理问题单，持续跟进修改结果。',editable()?'<button class="cs-button cs-primary" data-view="dev">'+(s.sessionOpen?'继续开发':'开始开发')+' →</button>':'')+`<div class="cs-stack"><div class="cs-banner"><span class="cs-avatar">↗</span><div class="cs-grow"><strong>${s.candidate} ${isOlder()?'保留在待命槽，可回退':'已发布，等待验证'}</strong><div class="cs-small cs-muted">打开试用版本，验证后由负责人正式上线。</div></div><button class="cs-link" data-view="release">查看版本 →</button></div><div class="cs-grid">${versionCard('正式版本',s.current,true)}${versionCard(isOlder()?'可回退版本':'待验证版本',s.candidate,false)}</div><section class="cs-panel cs-pad"><div class="cs-row cs-spread"><h2>当前开发</h2>${tag(s.sessionOpen?'会话已连接':'尚未开启',s.sessionOpen?'good':'')}</div><div class="cs-line cs-row cs-spread"><div><strong>main</strong><span class="cs-muted"> · ${s.dirty?'有未提交改动':'2 个提交尚未推送'} · 林晓开启</span><div class="cs-small cs-muted">开发预览使用开发数据；关闭页面后会话继续保留。</div></div><button class="cs-link" data-view="dev">进入开发 →</button></div><details><summary>项目技术详情</summary><div class="cs-small cs-muted">标识 demo · 命名空间 cs-demo · 仓库 crewstation/demo</div><code>项目 ID：prj_example_demo</code></details></section><section><h2>最近活动</h2><div class="cs-line cs-row cs-spread"><div>${tag('发布','good')} ${s.candidate} 已部署到待命槽</div><button class="cs-link" data-view="release">查看发布</button></div><div class="cs-line cs-row cs-spread"><div>${tag('历史失败','error')} v0.1.1 构建失败</div>${btn('查看失败日志','logs')}</div></section></div>`;}
function versionCard(title,version,active){const sha=version==='v0.1.2'?'3975d02':'9fd01fc';return `<section class="cs-panel cs-pad"><div class="cs-row cs-spread"><h2>${title}</h2>${tag(active?'正在服务':'待命槽','good')}</div><div class="cs-version">${version}</div><div class="cs-small cs-muted">${sha} · main · 1/1 副本就绪</div><div class="cs-rule"></div><div class="cs-row cs-spread"><span class="cs-small cs-muted">${active?'demo.example.test':'preview.demo.example.test'}</span>${btn(active?'打开正式应用 ↗':'打开试用版本 ↗',active?'open-prod':'open-trial')}</div></section>`;}
function dev(){
 if(!editable())return heading('开发','当前为 preview 测试者视角。')+`<div class="cs-panel cs-empty"><h2>试用待验证版本</h2><p class="cs-muted">此演示角色没有开发操作权限。</p>${btn('打开试用版本','open-trial',true)}</div>`;
 if(!s.sessionOpen)return heading('开始开发','选择工作分支，开启本项目的开发会话。')+`<div class="cs-panel cs-pad cs-stack"><label>工作分支<select id="cs-session-branch"><option value="main">main · 默认分支</option><option value="feature/preview">feature/preview · 与正式版本暂不可比较</option></select></label><div class="cs-callout">开发预览默认使用开发数据。已有正式版本 ${s.current} 继续服务。</div>${btn('开启开发会话','open-session',true)}</div>`;

function chatPanel(id){return `<section class="cs-chat cs-panel"><div class="cs-panel-head"><div class="cs-row"><span class="cs-avatar">A</span><label><span class="cs-small cs-muted">当前 Agent</span><select class="cs-select-compact" aria-label="选择 Agent" data-agent-select>${s.agents.map(a=>`<option value="${a}" ${a===id?'selected':''}>Agent ${a} · 等待输入</option>`).join('')}</select></label></div>${btn('＋ 新建','new-agent')}</div><div class="cs-transcript">${id==='1'?`<div class="cs-message cs-user">在问题列表里区分“待处理”和“处理中”，让大家能更快找到自己的问题。</div><div class="cs-message"><strong>Agent ${id}</strong><p>列表状态与筛选已调整。你可以在右侧预览中检查效果，再决定是否发布。</p><button class="cs-link" data-action="show-code">查看 src/Welcome.tsx →</button></div>`:''}${(s.messages[id]||[]).map(m=>`<div class="cs-message ${m.user?'cs-user':''}">${esc(m.text)}</div>`).join('')}</div><form class="cs-composer" data-form="chat" data-agent="${id}"><textarea aria-label="发给 Agent ${id} 的消息" name="message" placeholder="描述下一处想改进的地方…" data-draft="${id}">${esc(s.drafts[id]||'')}</textarea><div class="cs-row cs-spread"><span class="cs-small cs-muted">${esc(s.agentMeta[id].compute)} · ${esc(s.agentMeta[id].permission)}</span><button class="cs-button cs-primary" type="submit" ${s.scenario==='disconnected'?'disabled':''}>发送 ↑</button></div></form></section>`;}
function devPreview(){return `<div class="cs-panel-head"><span class="cs-small cs-muted">dev.demo.example.test</span><div class="cs-row">${tag('开发数据')}${btn('刷新','refresh-preview')}</div></div><div class="cs-preview">${s.scenario==='preview-failed'?`<div class="cs-empty"><h2>预览进程已退出</h2><p class="cs-muted">代码和 Agent 仍可继续使用。</p><div class="cs-row">${btn('查看预览日志','dev-logs')}${btn('重启预览','restart-preview',true)}</div></div>`:businessPreview()}</div>`;}

function editor(){return `<div class="cs-panel-head"><code>src/Welcome.tsx</code>${btn('保存文件','save-code',true)}</div><div class="cs-editor"><div class="cs-files"><div class="cs-small cs-muted">工作目录</div><span class="cs-small">src/Welcome.tsx</span><span class="cs-small cs-muted">crewstation.yaml</span></div><div class="cs-code"><textarea aria-label="代码编辑器" id="cs-code">${esc(s.code)}</textarea></div></div><div class="cs-notice">保存到开发工作区；代码提交仍由你或 Agent 显式完成。</div>`;}

function isOlder(){return Number(s.candidate.split('.').at(-1))<Number(s.current.split('.').at(-1));}
function release(){return heading('发布与上线','明确发布的代码，验证后再交给团队使用。',editable()?btn('准备新版本','prepare',true,s.publishing):'')+`<div class="cs-stack">${s.prepare?publishForm():''}${s.publishing?`<section class="cs-panel cs-pad" role="status"><h2>${esc(s.version)} 正在构建</h2><p class="cs-muted">代码已受理，正式版本 ${s.current} 继续服务。</p>${steps(3)}</section>`:''}<div class="cs-grid">${versionCard('正式版本',s.current,true)}${versionCard(isOlder()?'可回退版本':'待验证版本',s.candidate,false)}</div><div class="cs-callout cs-warning">试用版本与正式版本共用生产数据库和文件；开发预览默认使用开发数据。</div><section class="cs-panel cs-pad"><div class="cs-row cs-spread"><div><h2>${isOlder()?'回退到':'上线'} ${s.candidate}</h2><p class="cs-muted">${isOlder()?'此版本仍保留在待命槽。':'先打开试用版本验证，再确认正式上线。'}</p></div>${owner()?btn(isOlder()?'回退到 '+s.candidate:'正式上线','ask-switch',!isOlder(),s.publishing):tag('由项目负责人操作','warning')}</div>${s.confirm==='switch'?`<div class="cs-callout"><strong>确认${isOlder()?'回退':'上线'}：${s.current} → ${s.candidate}</strong><p class="cs-small cs-muted">正式访问地址保持不变，流量切换到 ${s.candidate}。生产数据不会随版本回退。</p><div class="cs-row">${btn('取消','cancel-switch')}${btn('确认切换正式版本','switch',true)}</div></div>`:''}${steps(6)}</section><section class="cs-panel"><div class="cs-panel-head"><h2>发布记录</h2><span class="cs-small cs-muted">按版本追踪结果</span></div><div class="cs-pad cs-table-wrap"><table><thead><tr><th>版本</th><th>结果</th><th>源码</th><th>下一步</th></tr></thead><tbody><tr><td>${s.candidate}</td><td>${tag('待命槽就绪','good')}</td><td><code>main · ${s.candidate==='v0.1.2'?'3975d02':'9fd01fc'}</code></td><td>${btn('打开试用','open-trial')}</td></tr><tr><td>${s.current}</td><td>${tag('正式服务','good')}</td><td><code>main · ${s.current==='v0.1.2'?'3975d02':'9fd01fc'}</code></td><td>${btn('查看运行状态','health')}</td></tr><tr><td>v0.1.1</td><td>${tag('构建失败','error')}</td><td><code>main · 3975d02</code></td><td>${btn('查看失败日志','logs')}</td></tr></tbody></table></div></section></div>`;}

function publishForm(){const dirty=s.dirty&&s.source==='session';return `<section class="cs-panel cs-pad"><div class="cs-row cs-spread"><h2>准备发布</h2>${btn('取消','close-prepare')}</div><form class="cs-form" data-form="publish" style="margin-top:14px" novalidate><div class="cs-grid"><label>代码来源<select id="cs-source" name="source"><option value="session" ${!s.sessionOpen?'disabled':''} ${s.source==='session'?'selected':''}>当前开发会话</option><option value="repository" ${s.source==='repository'?'selected':''}>已推送分支</option></select><small>${s.source==='session'?'main · 当前开发工作区':'main · 只发布远端已有提交，不包含本地修改'}</small></label><label>版本标签<input name="version" id="cs-version" value="${esc(s.version)}" aria-invalid="${Boolean(s.releaseError)}" aria-describedby="cs-version-rule cs-release-error"><small id="cs-version-rule">格式 v主版本.次版本.修订，例如 v0.1.5。</small></label></div><div class="cs-callout ${dirty?'cs-warning':''}">${dirty?`存在未提交的更改：<code>src/Welcome.tsx</code><br><button class="cs-link" data-action="show-code" type="button">返回代码处理 →</button>`:s.source==='session'?'✓ 工作区无未提交改动 · 将推送当前 main 分支的 2 个提交':'✓ 远端 main · 9fd01fc · 不读取开发容器工作区'}</div>${s.releaseError?`<div id="cs-release-error" class="cs-form-error" role="alert">${esc(s.releaseError)}</div>`:''}<div class="cs-small cs-muted">发布会构建固定提交并在生产数据库上执行迁移，然后部署为试用版本。正式流量仍由 ${s.current} 服务。</div><div><button class="cs-button cs-primary" type="submit" ${dirty||s.publishing?'disabled':''}>发布到试用</button></div></form></section>`;}

function createForm(){const d=s.projectDraft;const field=(name,label,hint)=>`<label>${label}<input name="${name}" value="${esc(d[name])}" aria-invalid="${Boolean(s.formErrors[name])}" aria-describedby="cs-${name}-hint"><small id="cs-${name}-hint">${hint}</small>${s.formErrors[name]?`<span class="cs-form-error" role="alert">${s.formErrors[name]}</span>`:''}</label>`;return `<section class="cs-panel cs-pad"><div class="cs-row cs-spread"><h2>创建${s.adminPage==='integrations'?'接入容器':'数字人'} · ${s.createStep} / 3</h2>${btn('取消','cancel-create')}</div><form class="cs-form" data-form="create" style="margin-top:16px" novalidate>${s.createStep===1?field('name','名称','必填，1–80 个字符。')+field('slug','标识','3–40 位，小写字母开头、字母或数字结尾，中间可含连字符。')+field('owner','负责人账号','选择已注册负责人；演示使用完整邮箱。'):s.createStep===2?`<label>模板<select name="template"><option ${d.template==='minimal-sample'?'selected':''}>minimal-sample</option>${s.adminPage==='integrations'?`<option ${d.template==='reference-api-proxy'?'selected':''}>reference-api-proxy</option>`:''}</select></label>${s.adminPage==='integrations'?`<label>接入类型<select name="kind"><option ${d.kind==='APIProxy'?'selected':''}>APIProxy</option><option ${d.kind==='EventProducer'?'selected':''}>EventProducer</option></select></label>`:''}<div class="cs-callout">服务套餐 standard-small · 并发任务上限 3。正式创建时从平台目录选择。</div>`:`<div class="cs-callout"><strong>${esc(d.name)}</strong><p>标识 ${esc(d.slug)} · 负责人 ${esc(d.owner)}</p><span class="cs-small cs-muted">${esc(d.template)} · ${s.adminPage==='integrations'?esc(d.kind):'DigitalWorker'}<br>创建后自动准备仓库、数据与样例发布。不会立即切换正式流量。</span></div>`}<div class="cs-row">${s.createStep>1?btn('上一步','create-back'):''}<button class="cs-button cs-primary" type="submit">${s.createStep<3?'下一步':'确认创建'}</button></div></form></section>`;}
function adminSettings(){const items={compute:['算力档位',[['balanced','日常开发与业务执行'],['deep','复杂分析与重构']]],plans:['服务套餐',[['standard-small','CPU 1 · 内存 1Gi · 最多 2 副本']]],taskProfiles:['任务容器套餐',[['coding-medium','CPU 2 · 内存 4Gi · 存储 10Gi']]],users:['用户与权限',[['林晓（示例）','已注册用户 · 项目负责人'],['平台管理员（示例）','平台配置与供给']]],egress:['出站规则',[['registry.npmjs.org','全局允许'],['packages.example.test','指定项目允许']]],gateway:['网关',[['正式服务域','按当前上线版本路由'],['试用域','按待命版本路由']]]}[s.adminPage];return heading(items[0],'目录维护与实际使用的上下文分开呈现。')+`<section class="cs-panel cs-pad">${items[1].map(([a,b])=>`<div class="cs-line"><strong>${a}</strong><p class="cs-muted">${b}</p></div>`).join('')}<details><summary>维护表单与详细配置</summary><p class="cs-small cs-muted">此处展示信息组织。完整增删改能力按 RFC 能力接续表实现；驱动与模型仅管理空间可见。</p></details></section>`;}

 e.preventDefault();const f=e.target;const values=new FormData(f);const type=f.dataset.form;
 if(type==='new-agent'){const prompt=String(values.get('prompt')||'').trim();if(!prompt){root.querySelector('#cs-agent-error').textContent='请填写首条指令。';f.querySelector('textarea').setAttribute('aria-invalid','true');f.querySelector('textarea').focus();return;}const id=String(s.agents.length+1);s.agents.push(id);s.agentMeta[id]={compute:String(values.get('compute')),permission:String(values.get('permission'))};s.messages[id]=[{user:true,text:prompt},{user:false,text:'新 Agent 已启动（仅演示）。已有 Agent 继续保留。'}];s.drafts[id]='';s.agent=id;s.newAgent=false;announce('新 Agent 已启动（示例）；未调用真实模型。');}
 if(type==='chat'){const v=String(values.get('message')||'').trim();const id=f.dataset.agent;if(!v){announce('请先输入要发送的消息。');return;}s.messages[id].push({user:true,text:v},{user:false,text:'已收到这条修改意图。此处演示消息如何与右侧结果保持在同一工作区；没有运行真实 Agent。'});s.drafts[id]='';announce('消息已加入演示对话。');}
 if(type==='publish'){s.version=String(values.get('version')).trim();if(!/^v\d+\.\d+\.\d+$/.test(s.version)){s.releaseError='版本格式不正确，请填写例如 v0.1.5。';render();return;}if([s.current,s.candidate,'v0.1.1'].includes(s.version)){s.releaseError='该版本已存在，请换一个版本标签。';render();return;}if(s.dirty&&s.source==='session')return;s.prepare=false;s.publishing=true;announce('发布已受理（演示）。');setTimeout(()=>{s.publishing=false;s.candidate=s.version;s.published=true;render();announce(s.candidate+' 已可试用（演示），尚未切换正式流量。');},1400);}
 if(type==='api-request'){const v=String(values.get('reason')||'').trim();if(!v){root.querySelector('#cs-request-error').textContent='请填写申请用途与使用范围。';return;}s.requestReason=v;s.requestState='pending';s.requestOpen=false;announce('申请已提交（演示），等待平台管理员处理。');}
 if(type==='member'){const email=String(values.get('email')||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){root.querySelector('#cs-member-error').textContent='请填写完整的已注册成员邮箱。';return;}if(email==='lin@example.test'||s.members.some(m=>m.email===email)){root.querySelector('#cs-member-error').textContent='该成员已在项目中。';return;}s.members.push({email,role:String(values.get('role'))});s.memberOpen=false;announce('已添加示例成员；真实成员未变更。');}
 if(type==='config'){const v=String(values.get('greeting')||'').trim();if(!v){root.querySelector('#cs-config-error').textContent='GREETING 不能为空。';return;}s.configValues[s.env]=v;announce('配置已保存（演示）；需要新发布或相应重启后生效。');}
 if(type==='create'){if(s.createStep===1){for(const k of ['name','slug','owner'])s.projectDraft[k]=String(values.get(k)||'').trim();const d=s.projectDraft;s.formErrors={};if(!d.name||d.name.length>80)s.formErrors.name='名称须为 1–80 个字符。';if(!/^[a-z][a-z0-9-]{1,38}[a-z0-9]$/.test(d.slug))s.formErrors.slug='标识不符合格式，请使用 3–40 位小写字母、数字和连字符。';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.owner))s.formErrors.owner='请指定一位已注册负责人，演示中填写完整邮箱。';if(Object.keys(s.formErrors).length){render();root.querySelector('[aria-invalid=true]').focus();announce('请修正各字段旁的错误。');return;}}if(s.createStep===2){s.projectDraft.template=String(values.get('template'));if(s.adminPage==='integrations')s.projectDraft.kind=String(values.get('kind'));}if(s.createStep<3)s.createStep++;else{s.created=true;s.adminCreate=false;announce('创建已受理（仅演示），真实平台没有新建项目。');}}
 render();
});
render();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{if(s.role!=='admin'&&s.admin){s.admin=false;s.view=s.lastView;}if(s.scenario==='dirty')s.dirty=true;if(s.scenario==='normal')s.dirty=false;render();}});t.addSelect(s,'role',{label:'演示身份',options:[{value:'owner',label:'项目负责人'},{value:'developer',label:'开发者'},{value:'tester',label:'preview 测试者'},{value:'admin',label:'管理员'}]});t.addSelect(s,'scenario',{label:'开发场景',options:[{value:'normal',label:'正常'},{value:'dirty',label:'存在未提交改动'},{value:'preview-failed',label:'预览失败'},{value:'disconnected',label:'连接断开'}]});t.addSelect(s,'density',{label:'内容密度',options:[{value:'comfortable',label:'舒适'},{value:'compact',label:'紧凑'}]});}
})();
</script>
