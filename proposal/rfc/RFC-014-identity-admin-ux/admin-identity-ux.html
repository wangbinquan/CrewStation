  function forwarding() {
    return `<section class="cs-card"><div class="cs-card-header"><div><h2>应用可获取的身份字段</h2><p class="cs-meta">全局默认。用户 ID 与身份令牌始终传递。</p></div></div>${fields.map(([key,name,desc])=>`<div class="cs-field-row"><div><div class="cs-name">${name} <code>${key}</code></div><span class="cs-meta">${desc}</span></div>${badge(state.globalFields.includes(key)?'传递给应用':'不传递',state.globalFields.includes(key)?'cs-ok':'')}${button(state.globalFields.includes(key)?'停止传递':'开启','toggle-field','cs-button cs-quiet',`data-key="${key}" aria-label="${state.globalFields.includes(key)?'停止传递':'开启'}${name}"`)}</div>${state.pendingField===key?`<div class="cs-notice cs-warning" style="margin:0 20px 14px"><p>停止向应用传递${name}？平台仍保留该信息，最长 5 分钟生效。</p><div class="cs-actions" style="margin-top:10px">${button('取消','cancel-field')}${button('确认停止','confirm-field','cs-button',`data-key="${key}"`)}</div></div>`:''}`).join('')}<div class="cs-footer">设置更新后，最长 5 分钟在所有副本生效。</div></section>
      <section class="cs-card cs-section"><div class="cs-card-header"><div><h2>项目例外</h2><p class="cs-meta">为个别项目设置不同的字段范围。</p></div>${button(icon('plus')+'添加','add-override')}</div>${state.overrides.length?state.overrides.map(o=>`<div class="cs-field-row"><div><div class="cs-name">${projects[o.project]}</div><span class="cs-meta">${o.fields.length?o.fields.map(k=>fields.find(f=>f[0]===k)[1]).join('、'):'不传递可选身份字段'}</span></div>${button('恢复默认','remove-override','cs-button cs-quiet',`data-project="${o.project}"`)}</div>${state.removeOverride===o.project?`<div class="cs-notice cs-warning" style="margin:0 20px 16px"><p>${projects[o.project]} 将重新使用全局默认，确认恢复？</p><div class="cs-actions">${button('取消','cancel-remove-override')}${button('确认恢复','confirm-remove-override','cs-button',`data-project="${o.project}"`)}</div></div>`:''}`).join(''):'<p class="cs-meta" style="padding:0 20px 20px">所有项目当前都使用全局默认。</p>'}${state.overrideOpen?overrideEditor():''}</section>`;
  }
  function overrideEditor() {
    return `<div class="cs-editor" style="border-top:1px solid var(--cs-line)"><label class="cs-field">选择项目<select class="cs-select" id="cs-project-select"><option value="">选择一个项目</option>${Object.entries(projects).map(([id,name])=>`<option value="${id}" ${state.overrideProject===id?'selected':''}>${name}</option>`).join('')}</select><small id="cs-project-identity">${state.overrideProject?projectIds[state.overrideProject]:'选择项目后可核对其完整 ID。'}</small></label><p class="cs-small-heading">这个项目可以获取</p><fieldset class="cs-choices"><legend class="cs-sr">项目身份字段</legend>${fields.map(([key,name])=>`<label class="cs-checkrow"><input type="checkbox" data-override-field="${key}" ${state.overrideFields.includes(key)?'checked':''}><span>${name} <code>${key}</code></span></label>`).join('')}</fieldset><p class="cs-meta" id="cs-override-summary">${state.overrideFields.length?`已选择 ${state.overrideFields.length} 个可选字段。`:'不传递任何可选字段；用户 ID 与身份令牌仍会传递。'}</p><div class="cs-form-actions">${button('取消','cancel-override')}${button('保存项目设置','save-override','cs-button cs-primary',state.overrideProject?'':'disabled')}</div></div>`;
  }
  function tryLeave(next) {
    if(state.providerEdit && JSON.stringify({providerDraft,mappings:state.mappings})!==formBaseline) {leaveAction=next;render();return;}
    next();
  }
  function leaveProvider() {state.providerEdit=false;providerDraft={};leaveAction=null;render();}
  root.addEventListener('input', event => {
    const el=event.target;
    if(el.id==='cs-user-search') {state.query=el.value;root.querySelector('#cs-user-rows').innerHTML=userRows();paintIcons();persist();}
    if(el.dataset.providerField) {providerDraft[el.dataset.providerField]=el.value;delete fieldErrors[el.dataset.providerField];}
    if(el.dataset.mapping) state.mappings[Number(el.dataset.index)][el.dataset.mapping]=el.value;
  });
  root.addEventListener('change', event => {
    const el=event.target;
    if(el.id==='cs-role-filter') {state.role=el.value;root.querySelector('#cs-user-rows').innerHTML=userRows();paintIcons();persist();}
    if(el.name==='cs-user-role') {state.picked=el.value;state.confirm=false;render();root.querySelector(`[name="cs-user-role"][value="${state.picked}"]`).focus();}
    if(el.dataset.providerCheck) providerDraft[el.dataset.providerCheck]=el.checked;
    if(el.name==='cs-provisioning') {providerDraft.provisioning=el.value;render();root.querySelector(`[name="cs-provisioning"][value="${el.value}"]`).focus();}
    if(el.dataset.providerField) providerDraft[el.dataset.providerField]=el.value;
    if(el.id==='cs-project-select') {state.overrideProject=el.value;root.querySelector('[data-action="save-override"]').disabled=!el.value;root.querySelector('#cs-project-identity').textContent=el.value?projectIds[el.value]:'选择项目后可核对其完整 ID。';}
    if(el.dataset.overrideField) {const key=el.dataset.overrideField;state.overrideFields=el.checked?[...state.overrideFields,key]:state.overrideFields.filter(f=>f!==key);root.querySelector('#cs-override-summary').textContent=state.overrideFields.length?`已选择 ${state.overrideFields.length} 个可选字段。`:'不传递任何可选字段；用户 ID 与身份令牌仍会传递。';}
  });
  root.addEventListener('keydown', event => {
    const button=event.target.closest('[role="tab"]'); if(!button) return;
    const tabs=Array.from(button.parentElement.querySelectorAll('[role="tab"]'));let next;
    if(event.key==='ArrowRight') next=(tabs.indexOf(button)+1)%tabs.length;
    if(event.key==='ArrowLeft') next=(tabs.indexOf(button)+tabs.length-1)%tabs.length;
    if(event.key==='Home') next=0;if(event.key==='End') next=tabs.length-1;
    if(next===undefined) return;event.preventDefault();const id=tabs[next].id;tabs[next].click();root.querySelector('#'+id)?.focus();
  });
  root.addEventListener('click', event => {
    const el=event.target.closest('button');if(!el||el.disabled) return;
    notify('');
    if(el.dataset.page) {tryLeave(()=>{state.page=el.dataset.page;state.providerEdit=false;state.selected=null;providerDraft={};render();persist();});return;}
    if(el.dataset.authTab) {state.tab=el.dataset.authTab;render();root.querySelector(`#cs-${state.tab}-tab`).focus();persist();return;}
    if(el.dataset.step!==undefined) {state.step=Number(el.dataset.step);render();root.querySelector(`#cs-step-${state.step}`).focus();return;}
    const action=el.dataset.action;
    if(action==='guide') {state.guide=!state.guide;render();}
    if(action==='clear-filters') {state.query='';state.role='all';render();persist();}
    if(action==='edit-role') {state.selected=el.dataset.id;state.picked=state.users.find(u=>u.id===state.selected).role;state.confirm=false;render();root.querySelector('[name="cs-user-role"]:checked').focus();}
    if(action==='close-role') {const id=state.selected;state.selected=null;state.confirm=false;render();root.querySelector(`[data-id="${id}"]`)?.focus();}
    if(action==='confirm-role') {state.confirm=true;render();root.querySelector('[data-action="save-role"]').focus();}
    if(action==='cancel-confirm') {state.confirm=false;render();root.querySelector('[data-action="confirm-role"]').focus();}
    if(action==='save-role') {const user=state.users.find(u=>u.id===state.selected);user.role=state.picked;state.selected=null;state.confirm=false;render();notify(`演示：${user.name} 的角色已更新为${roles[user.role][0]}。`);}
    if(action==='add-provider'||action==='edit-provider') {startProvider(action==='add-provider',el.dataset.providerId);render();}
    if(action==='probe'||action==='hide-probe') {state.probe=action==='probe'?el.dataset.providerId:false;render();if(state.probe)notify('已显示模拟诊断结果；没有发送真实连接请求。');}
    if(action==='password') {if(state.password){if(!state.providers.some(p=>p.enabled)){notify('演示：请先启用一个公司登录接入方。');return;}state.passwordConfirm=true;render();}else{state.password=true;render();notify('演示：密码登录已开启。');}}
    if(action==='cancel-password'||action==='disable-password') {state.passwordConfirm=false;if(action==='disable-password')state.password=false;render();}
    if(action==='next-step'||action==='previous-step') {state.step+=action==='next-step'?1:-1;render();root.querySelector('#cs-provider-step input, #cs-provider-step select')?.focus();}
    if(action==='leave-provider') tryLeave(leaveProvider);
    if(action==='stay-provider') {leaveAction=null;render();}
    if(action==='discard-provider') {const next=leaveAction;leaveAction=null;providerDraft={};formBaseline='';next?.();}
    if(action==='add-mapping'&&state.mappings.length<20) {state.mappings.push({key:'',claim:''});render();root.querySelectorAll('[data-mapping="key"]').item(state.mappings.length-1)?.focus();}
    if(action==='remove-mapping') {state.mappings.splice(Number(el.dataset.index),1);render();}
    if(action==='save-provider') {
      fieldErrors={};for(const key of ['name','slug','issuer','clientId','scopes',...(state.providerNew?['secret']:[])])if(!providerDraft[key]?.trim())fieldErrors[key]='请填写此项。';
      if(providerDraft.issuer&&!/^https?:\/\/.+/.test(providerDraft.issuer))fieldErrors.issuer='请填写完整的 http(s) 地址。';
      if(Object.keys(fieldErrors).length){state.step=0;render();root.querySelector('[aria-invalid="true"]')?.focus();return;}
      if(!providerDraft.enabled&&!state.password&&!state.providers.some(p=>p.id!==state.editProviderId&&p.enabled)){notify('演示：密码登录关闭时，须保留至少一个启用的公司登录接入方。');return;}
      const {secret,...configuration}=providerDraft;
      const saved={...configuration,id:state.editProviderId||'demo-'+Date.now(),secretSet:!!secret||configuration.secretSet,linked:!!configuration.linked,mappings:state.mappings.map(m=>({...m}))};
      state.providers=state.providers.filter(p=>p.id!==saved.id);state.providers.push(saved);
      leaveProvider();state.probe=false;render();notify('演示：配置已保存；列表已更新。');
    }
    if(action==='delete-provider') {state.deleteProviderConfirm=true;render();}
    if(action==='cancel-delete-provider') {state.deleteProviderConfirm=false;render();}
    if(action==='confirm-delete-provider') {const p=state.providers.find(p=>p.id===state.editProviderId);if(p.linked){notify('演示：此接入方仍有关联用户，不能删除。');return;}if(!state.password&&!state.providers.some(p=>p.id!==state.editProviderId&&p.enabled)){notify('演示：不能删除最后一个启用的公司登录接入方。');return;}state.providers=state.providers.filter(p=>p.id!==state.editProviderId);leaveProvider();notify('演示：接入方已删除。');}
    if(action==='toggle-field') {const key=el.dataset.key;if(state.globalFields.includes(key))state.pendingField=key;else state.globalFields.push(key);render();}
    if(action==='cancel-field') {state.pendingField=null;render();}
    if(action==='confirm-field') {state.globalFields=state.globalFields.filter(k=>k!==el.dataset.key);state.pendingField=null;render();notify('演示：全局字段范围已更新。');}
    if(action==='add-override') {state.overrideOpen=true;state.overrideProject='';state.overrideFields=[...state.globalFields];render();root.querySelector('#cs-project-select').focus();}
    if(action==='cancel-override') {state.overrideOpen=false;render();}
    if(action==='save-override'&&state.overrideProject) {state.overrides=state.overrides.filter(o=>o.project!==state.overrideProject);state.overrides.push({project:state.overrideProject,fields:[...state.overrideFields]});state.overrideOpen=false;render();notify('演示：项目身份字段已保存。');}
    if(action==='remove-override') {state.removeOverride=el.dataset.project;render();}
    if(action==='cancel-remove-override') {state.removeOverride=null;render();}
    if(action==='confirm-remove-override') {state.overrides=state.overrides.filter(o=>o.project!==el.dataset.project);state.removeOverride=null;render();notify('演示：此项目恢复全局默认。');}
  });
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  if(typeof Tweak!=='undefined') {
    const tweak=new Tweak({container:root,onChange:()=>{applyDesign();persist();}});
    tweak.addSelect(design,'density',{label:'列表密度',options:[{value:'compact',label:'紧凑'},{value:'comfortable',label:'舒展'}]});
    tweak.addSelect(design,'corners',{label:'边角',options:[{value:'soft',label:'柔和'},{value:'crisp',label:'利落'}]});
  }
})();
</script>
