# CrewStation Manifest（拟议协议 crewstation/v2）：平台按它构建、发布、注入配置，并登记订阅与 Agent 档案。
# 结构以 packages/contracts/manifest/*.ts 的 zod Schema 为准；发布时平台先校验再构建。
apiVersion: crewstation/v2
kind: DigitalWorker
spec:
  # 生产服务：preview 与 prod 两个蓝绿槽用同一条命令启动；端口与健康路径供网关路由与探针使用。
  service:
    command: ["bun", "run", "src/main.ts"]
    port: 3000
    healthPath: /healthz
    servicePlanId: 01a0bf5d-8f4b-7000-9e4b-b54e91ee9d10  # 服务套餐 UUID
    replicas: 1
  # 开发会话：TaskRunner 在开发容器内自动启动的预览进程。
  development:
    command: ["bun", "run", "--watch", "src/main.ts"]
    port: 3000
  # 配置与密钥是平台对象：按开发／生产两组取值以同名环境变量注入；生产值由项目负责人在工作台维护。
  env:
    - name: GREETING
      configDefinitionId: 01a0bf5d-8f4b-7100-8000-000000000001  # 模板槽位；创建项目时分配独立 UUID
      from: config
      # 生产组尚未维护该键时的兜底值：首个标签即可发布，负责人随后在工作台覆盖。
      default: 你好，数字人工作站
  apis:
    # 本服务要调用的内部 API 操作（<proxy>:<METHOD>:<path>）；样例不调用任何公司 API。
    requested: []
    # 本服务向其他数字人开放的 API，发布时登记进同一份目录。
    exposes:
      openapi: ./openapi.yaml
  # 事件订阅：cs-events 只向 prod 活动槽的处理路径推送 EventDelivery 信封。
  subscriptions:
    - eventTypeId: 01a0bf5d-8f4b-7102-8000-000000000001  # template.json 显式绑定已登记的 gitlab.push
      handlerPath: /events/gitlab
  # 业务任务：Agent 子任务只能引用这里登记的 agentProfile。
  tasks:
    taskProfileId: 01a0bf5d-8f4b-7001-8458-107366e7de39  # 任务套餐 UUID
    defaultVolumeMode: follow-container
    agentProfiles:
      - id: 01a0bf5d-8f4b-7101-8000-000000000001  # 模板槽位
        name: chat-v1
        # 算力由平台统一提供：这里只引用管理员定义的档位 UUID，不写镜像、二进制与模型。
        # default 指管理员当前设为默认的档位，每次起 Agent 时解析（RFC-006）；也可以写 { kind: profile, profileId: <UUID> }。
        compute: { kind: default }
        permission: read-only
    outputContracts: []
  release:
    migration:
      compatibility: none         # 样例没有数据库，也没有迁移
      destructive: false
      rollback: switch-back
